<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitales Team – NegotiateX.ai</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
body{font-size:14px;line-height:1.55}
main{padding:92px 28px 64px;max-width:1240px;margin:0 auto}
main nav{position:static;padding:0;background:none;backdrop-filter:none;z-index:auto;border-bottom:none;justify-content:flex-start}
h1{font-family:'Playfair Display',serif;font-size:28px;margin:0 0 4px}
h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.lead{color:var(--text-muted);margin:0 0 20px;max-width:760px}
.crumbs{font-size:12.5px;color:var(--text-muted);margin-bottom:8px}.crumbs a{color:var(--text-muted);text-decoration:none}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.sum div{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:180px}
.sum small{display:block;font-size:12px;color:var(--text-muted)}.sum b{font-family:'DM Mono',monospace;font-size:22px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.agent{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;gap:14px;align-content:start;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.agent:hover{border-color:var(--gold-border)}
.agent:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;gap:14px;align-items:center}
.top .who{flex:1;min-width:0}
.role{font-size:13px;color:var(--text-muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.working{background:rgba(47,174,122,.12);color:#1f8a5e}.pill.waiting{background:rgba(224,164,46,.15);color:#99650a}.pill.idle{background:var(--bg-card2);color:var(--text-muted)}
.now{font-size:13.5px;background:var(--bg-card2);border-radius:9px;padding:10px 12px}
.now b{font-weight:500}
.now .dim,.dim{color:var(--text-dim);font-size:12.5px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills span{font-size:11.5px;border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--text-muted)}
.stats{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.stats .k small{display:block;font-size:11.5px;color:var(--text-muted)}.stats .k b{font-family:'DM Mono',monospace;font-weight:500;font-size:15px}
.spark{display:block}
.note{font-size:12.5px;color:var(--text-muted);background:var(--bg-card2);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:18px}
dialog{border:1px solid var(--border);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:86vh;box-shadow:0 30px 60px rgba(0,0,0,.2);background:var(--bg-card);color:var(--text)}
dialog::backdrop{background:rgba(20,20,20,.35)}
.dh{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.dh .x{margin-left:auto}
.db{padding:16px 20px;overflow:auto;max-height:calc(86vh - 96px)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:11px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.log li:last-child{border-bottom:none}
.log .w{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text-dim);text-align:right;white-space:nowrap}
.st{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--border);color:var(--text-muted);margin-left:6px}
.st.failed{color:var(--status-bad);border-color:rgba(216,90,48,.35)}.st.running{color:#1f8a5e;border-color:rgba(47,174,122,.4)}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;border-radius:8px;padding:7px 13px;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text);text-decoration:none;display:inline-block}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.link{font-size:12.5px;color:var(--gold);text-decoration:none}.link:hover{text-decoration:underline}
.empty{padding:30px;text-align:center;color:var(--text-muted)}
@media(max-width:720px){main{padding:80px 16px 50px}.grid{grid-template-columns:1fr}.sum div{min-width:0;flex:1}}
@media (prefers-reduced-motion: reduce){.nx-avatar-svg animate{display:none}}
</style>
</head>
<body>
<header id="app-nav"></header>
<script src="/assets/app-nav.js"></script>
<script src="/assets/agents.js"></script>
<main id="app">
  <nav class="crumbs" aria-label="Brotkrumen"><a href="/arbeitsbereich">Arbeitsübersicht</a> / <span aria-current="page">Digitales Team</span></nav>
  <h1>Digitales Team</h1>
  <p class="lead">Ihre digitalen Mitarbeiter, ihre Fähigkeiten und woran sie gerade arbeiten. Sie bereiten Entwürfe, Prüfungen und Vergleiche vor – versendet und entschieden wird nur nach Freigabe durch einen Menschen.</p>
  <div class="sum" id="sum"></div>
  <div id="cost"></div>
  <div class="grid" id="grid"><div class="empty">Lade Team…</div></div>
</main>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<script>
const token = localStorage.getItem('nx_token');
const { avatar, esc } = window.NX_AGENTS;
const STATUS = { working: 'Arbeitet gerade', waiting: 'Wartet auf Freigabe', idle: 'Bereit' };
const LINKS = { briefing: '/arbeitsbereich/vorhaben?status=draft', scout: '/arbeitsbereich/vorhaben', korrespondenz: '/arbeitsbereich',
  pruefer: '/arbeitsbereich/vorhaben', verhandler: '/arbeitsbereich', recht: '/arbeitsbereich', analyst: '/data-center' };
const ago = iso => { if (!iso) return 'noch nie'; const s = (Date.now() - Date.parse(iso + 'Z')) / 1000;
  if (s < 90) return 'gerade eben'; if (s < 3600) return `vor ${Math.round(s / 60)} Min.`; if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`; return new Date(iso + 'Z').toLocaleDateString('de-DE'); };
const dur = ms => ms == null ? '' : ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`;
const num = n => (n ?? 0).toLocaleString('de-DE');
let data = null;

function spark(week, color) {
  const max = Math.max(1, ...week.map(d => d.count)), w = 124, h = 30, bw = 12, gap = 4;
  return `<svg class="spark" width="${w}" height="${h + 12}" viewBox="0 0 ${w} ${h + 12}" role="img" aria-label="Arbeitsschritte der letzten 7 Tage: ${week.map(d => d.count).join(', ')}">
    ${week.map((d, i) => { const bh = d.count ? Math.max(3, Math.round(d.count / max * h)) : 2; const x = i * (bw + gap);
      return `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="2" fill="${d.count ? color : 'var(--border)'}" opacity="${i === 6 ? 1 : .55}"><title>${new Date(d.date).toLocaleDateString('de-DE')}: ${d.count}</title></rect>`; }).join('')}
    <text x="${6 * (bw + gap) + bw}" y="${h + 11}" font-size="9" text-anchor="end" fill="var(--text-dim)" font-family="DM Mono, monospace">heute</text></svg>`;
}

function card(a) {
  const cur = a.current[0];
  let now;
  if (cur) now = `<b>${esc(cur.task)}</b>${cur.project_title ? `<div class="dim">${esc(cur.project_title)}</div>` : ''}<div class="dim">seit ${ago(cur.started_at)}</div>`;
  else if (a.waiting.count) now = `<b>${esc(a.waiting.label)}: ${a.waiting.count}</b><div><a class="link" href="${LINKS[a.key]}" onclick="event.stopPropagation()">Ansehen →</a></div>`;
  else if (a.recent[0]) now = `Zuletzt: ${esc(a.recent[0].task)}<div class="dim">${esc(a.recent[0].outcome || '')} · ${ago(a.recent[0].started_at)}</div>`;
  else now = `<span class="dim">Noch keine Aufgaben protokolliert.</span>`;
  const t = a.today;
  return `<button class="agent" data-k="${a.key}" aria-label="${esc(a.name)}: Arbeitsprotokoll öffnen">
    <div class="top">${avatar(a, 60, a.status)}<div class="who"><h2>${esc(a.name)}</h2><div class="role">${esc(a.role)}</div></div></div>
    <div><span class="pill ${a.status}">${STATUS[a.status]}</span></div>
    <div class="now">${now}</div>
    <div class="skills" aria-label="Skills">${a.skills.map(s => `<span>${esc(s)}</span>`).join('')}</div>
    <div class="stats"><div class="k"><small>Heute erledigt</small><b>${num(t.done)}</b>${t.failed ? ` <span class="dim">(${t.failed} Fehler)</span>` : ''}</div>
      <div class="k"><small>Ø Dauer</small><b>${t.avg_seconds != null ? t.avg_seconds.toLocaleString('de-DE') + ' s' : '–'}</b></div>
      ${data.show_costs ? `<div class="k"><small>KI-Tokens heute</small><b>${num((t.input_tokens || 0) + (t.output_tokens || 0))}</b></div>` : ''}
      ${spark(a.week, a.color)}</div>
  </button>`;
}

async function load() {
  const r = await fetch('/api/v1/agents', { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) { document.getElementById('grid').innerHTML = `<div class="empty">Das Team konnte nicht geladen werden (${r.status}).</div>`; return; }
  data = await r.json();
  const A = data.agents;
  const working = A.filter(a => a.status === 'working').length, waiting = A.reduce((s, a) => s + a.waiting.count, 0), done = A.reduce((s, a) => s + a.today.done, 0);
  document.getElementById('sum').innerHTML = `<div><small>Arbeiten gerade</small><b>${working}</b> <span class="dim">von ${A.length}</span></div>
    <div><small>Wartet auf Freigabe</small><b>${waiting}</b></div><div><small>Heute erledigt</small><b>${done}</b></div>`;
  if (data.show_costs) {
    const tok = A.reduce((s, a) => s + (a.today.input_tokens || 0) + (a.today.output_tokens || 0), 0);
    const cost = A.every(a => a.today.cost_eur != null) ? A.reduce((s, a) => s + Number(a.today.cost_eur || 0), 0) : null;
    document.getElementById('cost').innerHTML = `<div class="note">Nur für Admins sichtbar: heute ${num(tok)} KI-Tokens${cost != null ? ` · ca. ${cost.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' })}` : ' · Kosten werden angezeigt, sobald Tokenpreise hinterlegt sind'}.</div>`;
  }
  document.getElementById('grid').innerHTML = A.map(card).join('');
  document.querySelectorAll('.agent').forEach(b => b.onclick = () => openLog(b.dataset.k));
}

async function openLog(key) {
  const a = data.agents.find(x => x.key === key), dlg = document.getElementById('dlg');
  dlg.innerHTML = `<div class="dh">${avatar(a, 48, a.status)}<div><h2 id="dlg-title">${esc(a.name)}</h2><div class="role">${esc(a.role)}</div></div>
    <button class="btn x" id="dlg-x">Schließen</button></div><div class="db"><div class="empty">Lade Protokoll…</div></div>`;
  dlg.showModal();
  dlg.querySelector('#dlg-x').onclick = () => dlg.close();
  const r = await fetch(`/api/v1/agents/${key}/runs?limit=60`, { headers: { Authorization: 'Bearer ' + token } });
  const runs = r.ok ? await r.json() : [];
  dlg.querySelector('.db').innerHTML = runs.length ? `<h3 style="margin-bottom:6px">Arbeitsprotokoll</h3><ul class="log">${runs.map(x => `<li>
      <div><b>${esc(x.task)}</b>${x.status !== 'done' ? `<span class="st ${x.status}">${x.status === 'running' ? 'läuft' : 'fehlgeschlagen'}</span>` : ''}
        ${x.outcome ? `<div class="dim">${esc(x.outcome)}</div>` : ''}
        ${x.project_title ? `<div class="dim">Vorhaben: <a class="link" href="/arbeitsbereich/vorhaben/${x.project_id}">${esc(x.project_title)}</a></div>` : x.object_ref ? `<div class="dim">${esc(x.object_ref)}</div>` : ''}</div>
      <div class="w">${new Date(x.started_at + 'Z').toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}<br>${dur(x.duration_ms)}${x.llm_calls ? ` · ${x.llm_calls} KI-Aufruf${x.llm_calls > 1 ? 'e' : ''}` : ''}${x.input_tokens != null && (x.input_tokens + x.output_tokens) ? `<br>${num(x.input_tokens + x.output_tokens)} Tokens` : ''}</div></li>`).join('')}</ul>`
    : `<div class="empty">Für ${esc(a.name)} ist noch nichts protokolliert. Sobald er eine Aufgabe erledigt, erscheint sie hier.</div>`;
}

load();
setInterval(() => { if (!document.getElementById('dlg').open) load(); }, 20000);
</script>
</body>
</html>
