<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NegotiateX.ai — Master Data Center</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
:root{--hh:56px}
body{font-size:14px;line-height:1.5}
header{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--hh);background:rgba(247,246,241,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);text-decoration:none;flex-shrink:0}
.logo em{color:var(--gold);font-style:normal}
.hdr-sep{width:1px;height:20px;background:var(--border)}
.hdr-pg{font-size:12px;color:var(--text-muted)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.phase-note{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text-muted);background:var(--bg-card2);border:1px solid var(--border);padding:5px 10px;border-radius:7px;letter-spacing:.3px}
.h-btn{font-size:12px;color:var(--text-muted);background:transparent;border:1px solid var(--border);padding:5px 11px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none}
.h-btn:hover{border-color:var(--gold-border);color:var(--text)}
main{padding:calc(var(--hh) + 28px) 28px 60px;max-width:1200px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:4px}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;box-shadow:0 20px 48px rgba(22,32,28,0.04)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 18px;color:var(--text-muted);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 18px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.3px}
.b-uploaded{background:rgba(46,110,181,.1);color:#2E6EB5}
.b-parsed,.b-extracted,.b-validated{background:var(--gold-dim);color:var(--gold)}
.b-approved,.b-indexed{background:rgba(29,158,117,.1);color:var(--status-good)}
.b-needs_review{background:rgba(216,90,48,.1);color:var(--status-bad)}
.b-rejected{background:rgba(216,90,48,.1);color:var(--status-bad)}
.b-superseded{background:var(--bg-card2);color:var(--text-dim)}
.mono{font-family:'DM Mono',monospace}
.empty{padding:28px 18px;color:var(--text-muted);font-size:13px;text-align:center}
.loading{padding:40px;text-align:center;color:var(--text-muted)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px 18px}
.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif}
.btn{font-size:12px;border:1px solid var(--border);background:var(--bg-card2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn:hover{border-color:var(--gold-border)}
.btn.primary{background:var(--gold);color:#fff;border:none}
.row-actions{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap}
.disclaimer{font-size:11.5px;color:var(--text-dim);padding:12px 18px;border-top:1px dashed var(--border)}
.ver-list{list-style:none;padding:0;margin:0;font-size:12.5px}
.ver-list li{padding:8px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center}
.back{display:inline-block;margin-bottom:14px;color:var(--text-muted);font-size:12px;text-decoration:none;cursor:pointer}
.back:hover{color:var(--text)}
pre.textpreview{white-space:pre-wrap;font-family:'DM Mono',monospace;font-size:11.5px;padding:14px 18px;max-height:320px;overflow:auto;margin:0}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.review-grid{grid-template-columns:1fr}main{padding-left:16px;padding-right:16px}}
.review-grid pre.textpreview{max-height:620px}
mark{background:var(--gold-dim);color:var(--text);padding:1px 0;border-radius:2px}
.issues{list-style:none;padding:10px 18px;margin:0;font-size:12.5px}
.issues li{padding:5px 0}
.issues li.block{color:var(--status-bad)}
.issues li.hint{color:var(--text-muted)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}
.fieldgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px}
.fieldgrid input,.fieldgrid select{padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;text-transform:none;letter-spacing:0;color:var(--text)}
.fieldgrid .full{grid-column:1/-1}
.nav-tabs{display:flex;gap:8px;margin-bottom:18px}
.nav-tabs a{font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text-muted)}
.nav-tabs a.on{border-color:var(--gold-border);color:var(--text);background:var(--bg-card)}
td.num{font-family:'DM Mono',monospace;white-space:nowrap}
.b-missing_data{background:rgba(216,90,48,.1);color:var(--status-bad)}
.b-no_comparable_references{background:var(--bg-card2);color:var(--text-muted)}
.b-insufficient_evidence{background:var(--gold-dim);color:var(--gold)}
.b-benchmark_eligible{background:rgba(29,158,117,.1);color:var(--status-good)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:14px 18px}
.stat{background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.stat .l{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-family:'DM Mono',monospace;font-size:17px;margin-top:3px}
.explain{white-space:pre-wrap;font-family:'DM Sans',sans-serif;font-size:13.5px;line-height:1.6;padding:14px 18px;margin:0}
.searchbar{display:flex;gap:8px;padding:14px 18px}
.searchbar input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/dashboard"><em>Negotiate</em>X.ai</a>
  <div class="hdr-sep"></div>
  <span class="hdr-pg">Master Data Center — Daten, Preispruefung &amp; Angebotsvergleich</span>
  <div class="hdr-r">
    <span class="phase-note">Nur Dummy-/Testdaten · Suche lokal, ohne externe Dienste</span>
    <a class="h-btn" href="/dashboard">Zurueck zum Dashboard</a>
  </div>
</header>
<main id="app"><div class="loading">Lade...</div></main>

<script>
const token = localStorage.getItem('nx_token');
const user  = JSON.parse(localStorage.getItem('nx_user') || 'null');
if (!token || !user) location.href = '/login';

const API = '/api/v1/mdc';
const app = document.getElementById('app');

async function api(path, opts) {
  const res = await fetch(API + path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, ...(opts && opts.headers || {}) } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const d = body.detail;
    const msg = Array.isArray(d) ? d.map(x => x.msg).join('; ')
      : d && typeof d === 'object' ? [d.message, ...(d.blocking_issues || [])].filter(Boolean).join(' — ') : d;
    throw new Error(msg || ('HTTP ' + res.status));
  }
  return res.json();
}
function postJson(path, body) { return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function putJson(path, body) { return api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function tabs(active) {
  const t = [['inbox', 'Dokumenten-Inbox'], ['review', 'Review-Queue'], ['compare', 'Angebotsvergleich'], ['search', 'Belegsuche'], ['metrics', 'Kennzahlen']];
  return `<div class="nav-tabs">${t.map(([k, l]) => `<a href="#${k}" class="${active === k ? 'on' : ''}">${l}</a>`).join('')}</div>`;
}

async function downloadOriginal(path) {
  try {
    const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=utf-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url; a.download = m ? decodeURIComponent(m[1]) : 'original';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { alert('Download fehlgeschlagen: ' + e.message); }
}
const STATUS_LABELS = { extracted: 'vorgeschlagen', needs_review: 'Pruefung noetig', approved: 'freigegeben', rejected: 'abgelehnt', superseded: 'ersetzt' };
function rbadge(s) { return `<span class="badge b-${esc(s)}">${esc(STATUS_LABELS[s] || s)}</span>`; }
function fmtAmount(v, cur) { return v == null ? '—' : Number(v).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ' + esc(cur || ''); }

function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(v){ return `<span class="badge b-${esc(v)}">${esc(v)}</span>`; }

let tenantEnsured = false;
let myRole = 'member';  // nur fuer die Anzeige; durchgesetzt wird serverseitig
const isOwner = () => myRole === 'owner';
async function ensureTenant() {
  if (tenantEnsured) return;
  const authHeaders = { 'Authorization': 'Bearer ' + token };
  try {
    const r = await fetch('/api/v1/tenants/me', { headers: authHeaders });
    if (!r.ok) throw new Error('no-membership');
    myRole = (await r.json()).role || 'member';
  } catch (e) {
    const companyName = (user && (user.company_name || user.name)) || 'Mein Unternehmen';
    try {
      const c = await fetch('/api/v1/tenants', { method: 'POST', headers: { ...authHeaders, 'Content-Type': 'application/json' }, body: JSON.stringify({ company_name: companyName }) });
      if (c.ok) myRole = (await c.json()).role || 'member';
    } catch (e2) {}
  }
  tenantEnsured = true;
}
function ownerOnlyNote() { return '<div class="disclaimer">Entscheidungen (Freigabe, Rechte, Loeschen) trifft ein Owner des Mandanten.</div>'; }

let categories = [];

async function renderList() {
  app.innerHTML = '<div class="loading">Lade Dokumenten-Inbox...</div>';
  let docs = [], cats = [];
  try { [docs, cats] = await Promise.all([api('/documents'), api('/categories')]); }
  catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; return; }
  categories = cats;

  const catOptions = cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const typeOptions = ['ratecard','price_list','offer','contract','invoice','other'].map(t => `<option value="${t}">${t}</option>`).join('');

  const rows = docs.map(d => {
    const current = d.versions[d.versions.length - 1];
    return `<tr class="row" style="cursor:pointer" onclick="location.hash='#doc/${d.id}'">
      <td>${esc(d.title || '—')}</td>
      <td class="mono">${esc(d.document_type)}</td>
      <td class="mono">v${current ? current.version_number : '—'} (${d.versions.length} gesamt)</td>
      <td>${current ? badge(current.import_status) : '—'}</td>
      <td class="mono">${current ? new Date(current.created_at).toLocaleString('de-DE') : '—'}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <h1>Master Data Center</h1>
    <p class="sub">Dokumente importieren, versionieren und Preispositionen pruefen. Nur freigegebene Positionen fliessen in Preisvergleiche ein.</p>
    ${tabs('inbox')}

    <div class="panel">
      <div class="panel-h">Neues Dokument hochladen</div>
      <div class="formgrid">
        <input type="file" id="f-file">
        <select id="f-category"><option value="">Kategorie (optional)</option>${catOptions}</select>
        <select id="f-type">${typeOptions}</select>
        <input id="f-supplier" placeholder="Lieferant (optional)">
        <input id="f-title" placeholder="Titel (optional)">
        <input id="f-source" placeholder="Quelle (optional)">
        <input id="f-purpose" placeholder="Zulaessiger Nutzungszweck (optional)">
        <label style="font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px">Nutzungsrecht gueltig bis (optional)<input type="date" id="f-valid-until"></label>
      </div>
      <div class="row-actions">
        <button class="btn primary" onclick="doUpload()">Hochladen</button>
      </div>
      <div id="upload-msg"></div>
      <div class="disclaimer">Exakte Duplikate (gleicher Hash, gleicher Mandant) werden erkannt und nicht erneut importiert. Revisionen eines bestehenden Dokuments bitte in der Dokumentenansicht hochladen (ersetzt nichts, versioniert nur).</div>
    </div>

    <div class="panel">
      <div class="panel-h">Dokumenten-Inbox (${docs.length})</div>
      ${docs.length ? `<table><thead><tr><th>Titel</th><th>Typ</th><th>Version</th><th>Importstatus</th><th>Erstellt</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Noch keine Dokumente importiert.</div>'}
    </div>

    <div class="panel">
      <div class="panel-h">Kategorien (${cats.length})</div>
      ${cats.length ? `<table><thead><tr><th>Name</th><th>Pflichtmerkmale</th></tr></thead><tbody>${cats.map(c => `<tr><td>${esc(c.name)}</td><td class="mono">${esc(JSON.stringify(c.must_criteria_json))}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Keine Kategorien angelegt.</div>'}
    </div>`;
}

async function doUpload() {
  const fileInput = document.getElementById('f-file');
  const msg = document.getElementById('upload-msg');
  if (!fileInput.files.length) { msg.innerHTML = '<div class="empty">Bitte Datei waehlen.</div>'; return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  if (document.getElementById('f-category').value) fd.append('category_id', document.getElementById('f-category').value);
  fd.append('document_type', document.getElementById('f-type').value);
  if (document.getElementById('f-supplier').value) fd.append('supplier_name', document.getElementById('f-supplier').value);
  if (document.getElementById('f-title').value) fd.append('title', document.getElementById('f-title').value);
  if (document.getElementById('f-source').value) fd.append('source', document.getElementById('f-source').value);
  if (document.getElementById('f-purpose').value) fd.append('usage_purpose', document.getElementById('f-purpose').value);
  if (document.getElementById('f-valid-until').value) fd.append('rights_valid_until', document.getElementById('f-valid-until').value);
  msg.innerHTML = '<div class="loading">Lade hoch...</div>';
  try {
    const res = await fetch(API + '/documents/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Fehler');
    msg.innerHTML = data.duplicate ? '<div class="empty">Exaktes Duplikat erkannt -- bereits vorhanden, kein neuer Import.</div>' : '<div class="empty">Importiert.</div>';
    renderList();
  } catch (e) { msg.innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`; }
}

function rightsPanel(doc) {
  const r = doc.rights || {};
  const status = r.blocked_reason
    ? `<span class="badge b-rejected">gesperrt</span> ${esc(r.blocked_reason)}${r.revoked_reason ? ' — ' + esc(r.revoked_reason) : ''}`
    : '<span class="badge b-approved">nutzbar</span>';
  const owner = isOwner() ? `
    <div class="formgrid">
      <input id="r-purpose" placeholder="Zulaessiger Nutzungszweck" value="${esc(r.usage_purpose || '')}" ${r.revoked_at ? 'disabled' : ''}>
      <input id="r-scope" placeholder="Empfaengerkreis / Reichweite" value="${esc(r.usage_scope || '')}" ${r.revoked_at ? 'disabled' : ''}>
      <label style="font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px">Gueltig bis<input type="date" id="r-valid" value="${esc(r.valid_until || '')}" ${r.revoked_at ? 'disabled' : ''}></label>
    </div>
    <div class="row-actions">
      ${r.revoked_at ? '' : `<button class="btn" onclick="saveRights('${doc.id}')">Rechte speichern</button>
      <button class="btn" onclick="revokeRights('${doc.id}')">Nutzung widerrufen</button>`}
      <button class="btn" onclick="toggleLegalHold('${doc.id}', ${!r.legal_hold})">${r.legal_hold ? 'Aufbewahrungssperre aufheben' : 'Aufbewahrungssperre setzen'}</button>
      <button class="btn" style="color:var(--status-bad)" onclick="deleteDocument('${doc.id}')" ${r.legal_hold ? 'disabled title="Aufbewahrungssperre aktiv"' : ''}>Dokument loeschen</button>
    </div>
    <div id="rights-msg"></div>` : ownerOnlyNote();
  return `<div class="panel">
    <div class="panel-h">Nutzungsrechte &amp; Aufbewahrung</div>
    <div style="padding:14px 18px;font-size:13px">${status}
      <div class="mono" style="font-size:11.5px;color:var(--text-dim);margin-top:6px">Zweck: ${esc(r.usage_purpose || '—')} &middot; Reichweite: ${esc(r.usage_scope || '—')} &middot; gueltig bis: ${esc(r.valid_until || 'unbefristet')}
      ${r.legal_hold ? ` &middot; <b>Aufbewahrungssperre</b>: ${esc(r.legal_hold_reason || '')}` : ''}</div>
    </div>
    ${owner}
    <div class="disclaimer">Widerruf oder Ablauf nehmen das Dokument sofort aus Vergleich, Suche und Belegzugriff. Loeschen entfernt Original, Positionen, Suchindex und Vektoren und schwaerzt die Belegstellen in alten Analyse-Akten; die damals berechneten Zahlen bleiben als Nachweis stehen.</div>
  </div>`;
}

async function rightsAction(docId, fn) {
  const msg = document.getElementById('rights-msg');
  try { await fn(); renderDocument(docId); }
  catch (e) { if (msg) msg.innerHTML = `<div class="empty" style="color:var(--status-bad)">${esc(e.message)}</div>`; }
}
function saveRights(docId) {
  return rightsAction(docId, () => putJson(`/documents/${docId}/rights`, {
    usage_purpose: document.getElementById('r-purpose').value.trim() || null,
    usage_scope: document.getElementById('r-scope').value.trim() || null,
    rights_valid_until: document.getElementById('r-valid').value || null,
  }));
}
function revokeRights(docId) {
  const reason = prompt('Grund des Widerrufs (Pflicht). Das Dokument wird sofort aus Vergleich, Suche und Belegzugriff genommen:');
  if (!reason || !reason.trim()) return;
  return rightsAction(docId, () => postJson(`/documents/${docId}/revoke`, { reason }));
}
function toggleLegalHold(docId, active) {
  const reason = prompt(active ? 'Rechtsgrundlage der Aufbewahrung (Pflicht):' : 'Grund fuer das Aufheben der Aufbewahrungssperre (Pflicht):');
  if (!reason || !reason.trim()) return;
  return rightsAction(docId, () => postJson(`/documents/${docId}/legal-hold`, { active, reason }));
}
async function deleteDocument(docId) {
  const reason = prompt('Loeschgrund (Pflicht). Original, Positionen, Suchindex und Vektoren werden endgueltig entfernt:');
  if (!reason || !reason.trim()) return;
  if (!confirm('Endgueltig loeschen? Das kann nicht rueckgaengig gemacht werden.')) return;
  const msg = document.getElementById('rights-msg');
  try {
    const r = await api(`/documents/${docId}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }) });
    alert(`Geloescht: ${r.versions} Version(en), ${r.line_items} Position(en), ${r.removed_files} Datei(en); ${r.redacted_snapshots} Analyse-Akte(n) geschwaerzt.`);
    location.hash = '#inbox';
  } catch (e) { if (msg) msg.innerHTML = `<div class="empty" style="color:var(--status-bad)">${esc(e.message)}</div>`; }
}

async function renderDocument(id) {
  app.innerHTML = '<div class="loading">Lade...</div>';
  let doc;
  try { doc = await api(`/documents/${id}`); } catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; return; }

  const versionItems = doc.versions.slice().reverse().map(v => `
    <li>
      <div>
        v${v.version_number} — ${esc(v.file_name)} ${badge(v.import_status)}
        <div class="mono" style="font-size:11px;color:var(--text-dim)">${new Date(v.created_at).toLocaleString('de-DE')} &middot; ${(v.file_size_bytes/1024).toFixed(1)} KB ${v.source ? '&middot; Quelle: ' + esc(v.source) : ''}</div>
        ${v.import_error ? `<div style="color:var(--status-bad);font-size:11.5px;margin-top:4px">${esc(v.import_error)}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="downloadOriginal('${API}/documents/${doc.id}/versions/${v.id}/download')">Original</button>
        <button class="btn" onclick="showText('${doc.id}','${v.id}')">Text</button>
      </div>
    </li>`).join('');

  app.innerHTML = `
    <a class="back" onclick="location.hash=''">&larr; Zurueck zur Inbox</a>
    <h1>${esc(doc.title || 'Dokument')}</h1>
    <p class="sub">Typ: <span class="mono">${esc(doc.document_type)}</span> &middot; erstellt ${new Date(doc.created_at).toLocaleString('de-DE')}</p>

    ${rightsPanel(doc)}

    <div class="panel">
      <div class="panel-h">Neue Revision hochladen</div>
      <div class="formgrid"><input type="file" id="rev-file"><input id="rev-source" placeholder="Quelle (optional)"></div>

async function loadVersionItems(docId, version) {
  const panel = document.getElementById('items-panel');
  let items = [];
  try { items = await api(`/documents/${docId}/versions/${version.id}/line-items`); }
  catch (e) { panel.innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`; return; }

  const head = `<div class="panel-h">Preispositionen — Version ${version.version_number}</div>`;
  if (!items.length) {
    const canExtract = version.import_status !== 'superseded' && version.import_status !== 'uploaded';
    panel.innerHTML = head + `<div class="empty">Noch keine Positionen extrahiert.</div>` +
      (canExtract ? `<div class="row-actions"><button class="btn primary" id="extract-btn" onclick="doExtract('${docId}','${version.id}')">Preispositionen extrahieren</button></div>
      <div class="disclaimer">Die KI schlaegt Positionen nur vor. Jede Position wird anschliessend deterministisch geprueft (Betrag, Einheit, Steuerbasis, Beleg) und muss von einem Menschen freigegeben werden.</div>` : '');
    return;
  }
  const rows = items.map(i => {
    const blocking = (i.open_issues_json || []).filter(x => x.blocking).length;
    const hints = (i.open_issues_json || []).length - blocking;
    return `<tr class="row" style="cursor:pointer" onclick="location.hash='#item/${i.id}'">
      <td>${esc(i.role_or_item || '—')}<div class="mono" style="font-size:11px;color:var(--text-dim)">${esc([i.seniority, i.region].filter(Boolean).join(' · '))}</div></td>
      <td class="num">${fmtAmount(i.original_amount, i.original_currency)} / ${esc(i.original_unit || '?')}</td>
      <td class="mono">${esc(i.tax_basis)}</td>
      <td class="num">${i.normalized_amount_per_canonical_unit != null ? fmtAmount(i.normalized_amount_per_canonical_unit, i.original_currency) + ' / ' + esc(i.canonical_unit) : '—'}</td>
      <td>${rbadge(i.review_status)}</td>
      <td style="font-size:12px">${blocking ? `<span style="color:var(--status-bad)">${blocking} blockierend</span>` : ''}${blocking && hints ? ' · ' : ''}${hints ? `<span style="color:var(--text-muted)">${hints} Hinweis${hints > 1 ? 'e' : ''}</span>` : ''}</td>
    </tr>`;
  }).join('');
  panel.innerHTML = head + `<table><thead><tr><th>Rolle / Artikel</th><th>Original</th><th>Steuer</th><th>Normalisiert (netto)</th><th>Status</th><th>Offene Punkte</th></tr></thead><tbody>${rows}</tbody></table>`;

function highlightEvidence(text, evidence) {
  const safe = esc(text || '');
  const ev = (evidence || '').trim();
  if (!ev) return safe;
  const safeEv = esc(ev);
  const idx = safe.indexOf(safeEv);
  if (idx === -1) return safe;
  return safe.slice(0, idx) + '<mark id="ev-mark">' + safeEv + '</mark>' + safe.slice(idx + safeEv.length);
}

function collectItemChanges(original) {
  const ids = ['role_or_item', 'seniority', 'region', 'original_unit', 'original_amount', 'original_currency', 'tax_basis', 'tax_rate_pct', 'billable_hours_per_day', 'valid_from', 'valid_to', 'offer_date', 'price_status', 'source_evidence'];
  const changes = {};
  ids.forEach(k => {
    const el = document.getElementById('fi-' + k);
    const v = el.value.trim();
    const before = original[k] == null ? '' : String(original[k]);
    if (v !== before) changes[k] = v === '' ? null : v;
  });
  const anc = {};
  let ancChanged = false;
  Object.keys(ANC_LABELS).forEach(k => {
    const v = document.getElementById('fi-anc-' + k).value;
    const prev = (original.ancillary_costs_json || {})[k] || {};
    anc[k] = { status: v, amount: prev.amount ?? null };
    if (v !== (prev.status || 'unknown')) ancChanged = true;
  });
  if (ancChanged) changes.ancillary_costs_json = anc;
  const confirm = document.getElementById('fi-confirm_amount').checked;
  if (confirm && !original.amount_confirmed) changes.confirm_amount = true;
  return changes;
}

async function saveItem(id) {
  const msg = document.getElementById('item-msg');
  try {
    const original = await api(`/line-items/${id}`);
    const changes = collectItemChanges(original);
    if (!Object.keys(changes).length) { msg.innerHTML = '<div class="empty">Keine Aenderungen.</div>'; return; }
    await putJson(`/line-items/${id}`, changes);
    renderItem(id);
  } catch (e) { msg.innerHTML = `<div class="empty" style="color:var(--status-bad)">${esc(e.message)}</div>`; }
}

async function requestReview(id) {
  const reason = prompt('Was ist unklar? (Die Position verlaesst sofort den Vergleichsbestand, bis sie erneut freigegeben ist.)');
  if (!reason || !reason.trim()) return;
  try { await postJson(`/line-items/${id}/request-review`, { reason }); renderItem(id); }
  catch (e) { document.getElementById('item-msg').innerHTML = `<div class="empty" style="color:var(--status-bad)">${esc(e.message)}</div>`; }
}

async function decideItem(id, action) {
  const msg = document.getElementById('item-msg');
  try {
    const original = await api(`/line-items/${id}`);
    const changes = collectItemChanges(original);
    if (Object.keys(changes).length) {
      msg.innerHTML = '<div class="empty" style="color:var(--status-bad)">Es gibt ungespeicherte Aenderungen -- bitte zuerst speichern, damit genau die gepruefte Fassung entschieden wird.</div>';
      return;
    }
    let note = null;
    if (action === 'reject') {
      note = prompt('Ablehnungsgrund (Pflicht):');
      if (!note || !note.trim()) return;
    } else {
      note = prompt('Optionale Notiz zur Freigabe:') || null;
    }
    await postJson(`/line-items/${id}/${action}`, { note });
    renderItem(id);
  } catch (e) { msg.innerHTML = `<div class="empty" style="color:var(--status-bad)">${esc(e.message)}</div>`; }
}

async function doRevisionUpload(docId) {
  const fileInput = document.getElementById('rev-file');
  const msg = document.getElementById('rev-msg');
  if (!fileInput.files.length) { msg.innerHTML = '<div class="empty">Bitte Datei waehlen.</div>'; return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fd.append('revision_of_document_id', docId);
  fd.append('document_type', 'other');
  if (document.getElementById('rev-source').value) fd.append('source', document.getElementById('rev-source').value);
  msg.innerHTML = '<div class="loading">Lade hoch...</div>';
  try {
    const res = await fetch(API + '/documents/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Fehler');
    renderDocument(docId);
  } catch (e) { msg.innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`; }
}

async function showText(docId, versionId) {
  const panel = document.getElementById('text-panel');
  const content = document.getElementById('text-content');
  panel.style.display = 'block';
  content.textContent = 'Lade...';
  try {
    const data = await api(`/documents/${docId}/versions/${versionId}/text`);
    content.textContent = data.extracted_text || data.import_error || '(kein Text)';
  } catch (e) { content.textContent = 'Fehler: ' + e.message; }
}

      </div>
      ${st.dominant_supplier ? `<div class="disclaimer">Dominanter Lieferant: ${esc(st.dominant_supplier.supplier_name)} (${pct(st.dominant_supplier.share_pct)} der Beobachtungen).</div>` : ''}
      <table><thead><tr><th>Wert netto</th><th>Lieferant / Beleg</th><th>Datum</th><th>Angebot vs. Referenz</th><th></th><th></th></tr></thead><tbody>${refRows}</tbody></table>
    </div>`;
  }).join('');

  const histRows = (r.historical || []).map(h => `<tr><td class="num">${fmtAmount(h.value, cur)}</td><td>${esc(h.supplier_name || '—')}</td><td>${esc(h.historical_reason)}</td><td><button class="btn" onclick="showEvidence('${h.line_item_id}')">Beleg</button></td></tr>`).join('');
  const exclRows = (r.excluded || []).map(e => `<tr><td>${esc(e.role_or_item || '—')}</td><td>${esc(e.supplier_name || '—')}</td><td>${esc(e.reason)}</td><td><button class="btn" onclick="showEvidence('${e.line_item_id}')">Beleg</button></td></tr>`).join('');

  app.innerHTML = `
    <a class="back" onclick="location.hash='#compare'">&larr; Zurueck zum Angebotsvergleich</a>
    <h1>Analyse: ${esc(t.role_or_item || 'Angebot')}</h1>
    <p class="sub">${abadge(s.status)} &middot; Angebot ${t.value != null ? fmtAmount(t.value, cur) + ' netto / ' + esc(t.canonical_unit) : 'ohne Nettowert'} &middot; ${esc([t.seniority, t.region].filter(Boolean).join(' · '))}
      &middot; Stichtag ${esc(s.as_of)} &middot; Regelwerk ${esc(s.policy_id)} v${esc(s.policy_version)}</p>

    ${s.currency && s.currency.changed ? `<div class="panel" style="border-color:rgba(216,90,48,.35)">
      <div class="panel-h" style="color:var(--status-bad)">Bestand hat sich seit dieser Analyse geaendert</div>
      <ul class="issues">${s.currency.details.map(d => `<li class="block">Referenz ${esc(d.line_item_id.slice(0, 8))}: ${esc(d.change)}</li>`).join('')}</ul>
      <div class="disclaimer">Diese Akte bleibt als Nachweis unveraendert. Fuer eine aktuelle Bewertung bitte neu vergleichen.</div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-h">Einordnung</div>
      <pre class="explain">${esc(s.explanation)}</pre>
      <div class="disclaimer">Alle Zahlen stammen aus dem deterministischen Vergleichsservice; der Text wird daraus erzeugt, nicht von einem Sprachmodell formuliert. Diese Akte ist eingefroren -- Korrekturen am Bestand wirken erst in einer neuen Analyse.</div>
    </div>

    ${(r.missing_data || []).length ? `<div class="panel"><div class="panel-h">Fehlende Angaben am Angebot</div><ul class="issues">${r.missing_data.map(m => `<li class="block">${esc(m)}</li>`).join('')}</ul>
      <div class="row-actions"><a class="btn" style="text-decoration:none" href="#item/${t.line_item_id}">Angebotsposition pruefen</a></div></div>` : ''}

    ${classPanels}

    <div id="evidence-panel"></div>

    ${histRows ? `<div class="panel"><div class="panel-h">Nur historisch (nicht im aktuellen Vergleich)</div><table><thead><tr><th>Wert</th><th>Lieferant</th><th>Grund</th><th></th></tr></thead><tbody>${histRows}</tbody></table></div>` : ''}
    ${exclRows ? `<div class="panel"><div class="panel-h">Ausgeschlossen (${r.excluded.length})</div><table><thead><tr><th>Position</th><th>Lieferant</th><th>Ausschlussgrund</th><th></th></tr></thead><tbody>${exclRows}</tbody></table></div>` : ''}

    <div class="panel">
      <div class="panel-h">Gesamtkosten (TCO)</div>
      <ul class="issues">${(r.tco.reasons || []).map(x => `<li class="hint">${esc(x)}</li>`).join('')}</ul>
    </div>

    <div class="panel">
      <div class="panel-h">Regelwerk &amp; Nachvollziehbarkeit</div>
      <div class="disclaimer" style="border-top:none">Aktualitaet ${r.policy.freshness_days} Tage &middot; Benchmark ab ${r.policy.benchmark_min_projects} Projekten und ${r.policy.benchmark_min_suppliers} Lieferanten &middot; Median ab n=${r.policy.median_min_n}, Quartile ab n=${r.policy.quartile_min_n} (${esc(r.policy.quantile_method)}) &middot; Ausreisser: ${esc(r.policy.outlier_rule)}<br>
      Snapshot <span class="mono">${esc(s.id)}</span> &middot; erstellt ${new Date(s.created_at).toLocaleString('de-DE')} &middot; ${(s.input.candidate_line_item_ids || []).length} freigegebene Positionen der Kategorie geprueft</div>
      <div class="row-actions">
        <a class="btn" style="text-decoration:none" href="#item/${t.line_item_id}">Angebotsposition</a>
        <button class="btn" onclick="runAnalysis('${t.line_item_id}', this)">Mit aktuellem Bestand neu vergleichen</button>
      </div>
    </div>`;
}

async function showEvidence(itemId) {
  const panel = document.getElementById('evidence-panel');
  panel.innerHTML = '<div class="panel"><div class="loading">Lade Beleg...</div></div>';
  try {
    const e = await api(`/evidence/${itemId}`);
    const ctx = (e.context || []).map(l => {
      const safe = esc(l);
      return e.source_evidence && l.includes(e.source_evidence) ? `<mark>${safe}</mark>` : safe;
    }).join('\n');
    panel.innerHTML = `<div class="panel">
      <div class="panel-h">Beleg: ${esc(e.document_title || '')} · v${e.version_number} ${e.version_status === 'superseded' ? '<span class="badge b-superseded">ersetzt</span>' : ''}</div>
      <pre class="textpreview">${ctx || esc(e.source_evidence || '(keine Belegstelle)')}</pre>
      <div class="row-actions">
        <button class="btn" onclick="downloadOriginal('${e.download_path}')">Original herunterladen</button>
        <a class="btn" style="text-decoration:none" href="#doc/${e.document_id}">Zum Dokument</a>
        <a class="btn" style="text-decoration:none" href="#item/${e.line_item_id}">Zur Position</a>
      </div>
    </div>`;
    panel.scrollIntoView({ block: 'center', behavior: 'smooth' });
  } catch (err) { panel.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(err.message)}</div></div>`; }
}

const AUDIT_LABELS = {
  document_uploaded: 'Dokument hochgeladen', revision_uploaded: 'Revision hochgeladen', lines_extracted: 'Positionen extrahiert',
  line_item_updated: 'Position geaendert', line_item_approved: 'Position freigegeben', line_item_rejected: 'Position abgelehnt',
  review_requested: 'Pruefanfrage', analysis_created: 'Analyse erstellt', rights_updated: 'Rechte geaendert',
  rights_revoked: 'Nutzung widerrufen', legal_hold_set: 'Aufbewahrungssperre gesetzt', legal_hold_released: 'Aufbewahrungssperre aufgehoben',
  document_deleted: 'Dokument geloescht', original_downloaded: 'Original heruntergeladen', category_created: 'Kategorie angelegt',
  rights_expired_deindexed: 'Rechte abgelaufen (aus Suche entfernt)', rules_recheck: 'Neupruefung nach Regelaenderung',
};

async function renderMetrics() {
  app.innerHTML = '<div class="loading">Lade Kennzahlen...</div>';
  let m, h, audit = null;
  try { [m, h] = await Promise.all([api('/metrics'), api('/health')]); }
  catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; return; }
  if (isOwner()) { try { audit = await api('/audit?limit=60'); } catch (e) { audit = null; } }
  const stat = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v" style="font-size:15px">${v == null ? '—' : esc(v)}</div></div>`;
  const breadth = Object.entries(m.breadth_by_category || {}).map(([cat, classes]) => Object.entries(classes).map(([cls, x]) => `
    <tr><td>${esc(cat)}</td><td>${esc(cls)}</td><td class="num">${x.observations}</td><td class="num">${x.projects}</td><td class="num">${x.suppliers}</td>
    <td>${x.benchmark_eligible ? '<span class="badge b-approved">Benchmark</span>' : '<span class="badge b-insufficient_evidence">zu schmal</span>'}</td></tr>`).join('')).join('');
  const issues = Object.entries(m.open_mandatory_fields.by_issue || {}).map(([k, v]) => `${esc(k)}: ${v}`).join(' &middot; ') || 'keine';
  const auditRows = (audit || []).map(e => `<tr><td class="mono">${new Date(e.created_at).toLocaleString('de-DE')}</td>
    <td>${esc(AUDIT_LABELS[e.action] || e.action)}</td><td class="mono">${esc(e.object_type)} ${esc((e.object_id || '').slice(0, 8))}</td>
    <td class="mono">${esc(e.actor === 'system' ? 'System' : e.actor.slice(0, 8))}</td></tr>`).join('');
  const healthOk = h.status === 'ok';

  app.innerHTML = `
    <h1>Kennzahlen &amp; Betrieb</h1>
    <p class="sub">Betriebsmetriken des Datenbestands (Stand ${esc(m.as_of)}). HTTP-Latenzen aller Endpunkte werden zusaetzlich in Prometheus/Grafana erfasst.</p>
    ${tabs('metrics')}
    <div class="panel">
      <div class="panel-h">Zustand ${healthOk ? '<span class="badge b-approved">ok</span>' : '<span class="badge b-rejected">eingeschraenkt</span>'}</div>
      <div class="statgrid">
        ${stat('Datenbank', h.checks.database ? 'erreichbar' : 'FEHLER')}${stat('pgvector', h.checks.pgvector)}
        ${stat('Suchabschnitte', h.checks.search_index.chunks)}${stat('ohne Vektor', h.checks.search_index.without_vector)}
        ${stat('fremdes Modell', h.checks.search_index.other_model)}${stat('freigegeben, nicht indexiert', h.checks.approved_but_not_indexed_versions)}
      </div>
    </div>
    <div class="panel">
      <div class="panel-h">Datenqualitaet</div>
      <div class="statgrid">
        ${stat('Positionen', m.positions.total)}${stat('davon freigegeben', (m.positions.approved_share_pct ?? '—') + ' %')}
        ${stat('offene Pflichtfelder', m.open_mandatory_fields.positions)}${stat('Belege im Original gefunden', (m.source_coverage.approved_with_evidence_in_text_pct ?? '—') + ' %')}
        ${stat('abgelehnt', m.corrections.rejected)}${stat('nach Freigabe korrigiert', m.corrections.changed_after_approval)}
        ${stat('Pruefanfragen', m.corrections.review_requests)}${stat('Datenalter (Median, Tage)', m.data_age.median_days)}
      </div>
      <div class="disclaimer">Offene Punkte nach Art: ${issues}</div>
    </div>
    <div class="panel">
      <div class="panel-h">Datenbreite je Kategorie und Referenzklasse</div>
      ${breadth ? `<table><thead><tr><th>Kategorie</th><th>Klasse</th><th>Beobachtungen</th><th>Projekte</th><th>Lieferanten</th><th>Benchmark</th></tr></thead><tbody>${breadth}</tbody></table>` : '<div class="empty">Noch keine freigegebenen Positionen.</div>'}
    </div>
    <div class="panel">
      <div class="panel-h">Extraktion &amp; Rechte</div>
      <div class="statgrid">
        ${stat('extrahierte Versionen', m.extraction.versions)}${stat('Dauer Median (s)', m.extraction.median_seconds)}${stat('Dauer p95 (s)', m.extraction.p95_seconds)}
        ${stat('Tokens ein / aus (Schnitt)', m.extraction.avg_input_tokens == null ? null : m.extraction.avg_input_tokens + ' / ' + m.extraction.avg_output_tokens)}
        ${stat('Kosten je Dokument', m.extraction.avg_cost_per_document == null ? 'nicht konfiguriert' : m.extraction.avg_cost_per_document)}
        ${stat('gesperrte Dokumente', m.rights.blocked_documents)}${stat('Suchabschnitte gesperrter Dok.', m.rights.search_chunks_of_blocked_documents)}${stat('Aufbewahrungssperren', m.rights.legal_hold)}
      </div>
    </div>
    ${isOwner() ? `<div class="panel">
      <div class="panel-h">Audit-Protokoll (letzte 60, unveraenderlich)</div>
      ${auditRows ? `<table><thead><tr><th>Zeit</th><th>Aktion</th><th>Objekt</th><th>Akteur</th></tr></thead><tbody>${auditRows}</tbody></table>` : '<div class="empty">Keine Eintraege.</div>'}
    </div>` : ''}`;
}

function renderSearch() {
  app.innerHTML = `
    <h1>Belegsuche</h1>
    <p class="sub">Sucht nach Wortlaut und Bedeutung (z.B. findet "Fahrtkosten" auch "Reisekosten") in vollstaendig freigegebenen Dokumenten des eigenen Mandanten. Ungepruefte, abgelehnte oder ersetzte Fassungen werden nicht durchsucht.</p>
    ${tabs('search')}
    <div class="panel">
      <form class="searchbar" onsubmit="event.preventDefault(); doSearch();">
        <input id="q" placeholder="z.B. Editor Stundensatz, Reisekosten, DoP" autofocus>
        <button class="btn primary" type="submit">Suchen</button>
      </form>
      <div id="search-results"></div>
      <div class="disclaimer">Hybride Suche: PostgreSQL-Volltext plus semantische Naehe ueber ein lokal auf dem Server laufendes Sprachmodell (jina-embeddings-v2-base-de) -- Dokumenttexte verlassen den Server nicht. Semantische Treffer liefern Kontext; fuer den Preisvergleich zaehlen weiterhin nur exakt passende, freigegebene Merkmale.</div>
    </div>`;
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  const out = document.getElementById('search-results');
  if (!q) return;
  out.innerHTML = '<div class="loading">Suche...</div>';
  try {
    const res = await api('/search?q=' + encodeURIComponent(q));
    const note = res.semantic_available ? '' : '<div class="disclaimer" style="color:var(--status-bad)">Semantische Suche gerade nicht verfuegbar -- nur Volltext-Treffer.</div>';
    if (!res.hits.length) { out.innerHTML = note + '<div class="empty">Keine Treffer in freigegebenen Dokumenten.</div>'; return; }
    const MATCH = { beides: 'Wortlaut + Bedeutung', volltext: 'Wortlaut', semantisch: 'Bedeutung' };
    out.innerHTML = note + `<table><thead><tr><th>Dokument</th><th>Stelle</th><th>Auszug</th><th>Treffer</th></tr></thead><tbody>${res.hits.map(h => `
      <tr class="row" style="cursor:pointer" onclick="location.hash='#doc/${h.document_id}'">
        <td>${esc(h.document_title || '—')}<div class="mono" style="font-size:11px;color:var(--text-dim)">v${h.version_number}</div></td>
        <td class="mono" style="font-size:11.5px">${esc(h.anchor || '—')}</td>
        <td style="font-size:12.5px;white-space:pre-wrap">${esc(h.snippet).replace(/&lt;&lt;/g, '<mark>').replace(/&gt;&gt;/g, '</mark>')}</td>
        <td style="font-size:12px;white-space:nowrap">${esc(MATCH[h.match] || h.match)}${h.semantic_similarity != null ? `<div class="mono" style="font-size:11px;color:var(--text-dim)">Naehe ${Number(h.semantic_similarity).toFixed(2)}</div>` : ''}</td>
      </tr>`).join('')}</tbody></table>`;
  } catch (e) { out.innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`; }
}

async function route() {
  await ensureTenant();
  const hash = location.hash;
  try {
    if (hash.startsWith('#doc/')) await renderDocument(hash.slice(5));
    else if (hash.startsWith('#item/')) await renderItem(hash.slice(6));
    else if (hash === '#review') await renderReviewQueue();
    else if (hash === '#compare') await renderCompare();
    else if (hash.startsWith('#analysis/')) await renderAnalysis(hash.slice(10));
    else if (hash === '#search') renderSearch();
    else if (hash === '#metrics') await renderMetrics();
    else await renderList();
  } catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; }
}
window.addEventListener('hashchange', route);
route();
</script>

</html>
