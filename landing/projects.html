<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NegotiateX.ai — Vorhaben</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
body{font-size:14px;line-height:1.5}
main{padding:84px 28px 60px;max-width:1180px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin:0 0 4px}
h2{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;margin:0 0 10px}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;box-shadow:0 20px 48px rgba(22,32,28,.04)}
.panel-h{padding:13px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-b{padding:16px 18px}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim);font-size:12px}.mono{font-family:'DM Mono',monospace}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold-border)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}.btn.pri:hover{background:var(--gold-light)}
.btn.ok{background:var(--status-good);border-color:var(--status-good);color:#fff}
.btn.bad{color:var(--status-bad);border-color:rgba(216,90,48,.35)}
.btn.sm{font-size:12px;padding:5px 10px}
.btn[disabled]{opacity:.5;cursor:wait}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{padding:24px;cursor:pointer;transition:border-color .15s}
.choice:hover{border-color:var(--gold-border)}
.choice h2{margin-bottom:6px}.choice p{color:var(--text-muted);margin:0 0 14px}
label{display:block;font-size:12px;color:var(--text-muted);margin:12px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{width:100%;box-sizing:border-box;font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.q{background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.q ul{margin:6px 0 0 18px;padding:0}
.warn{background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.25);border-radius:8px;padding:10px 14px;font-size:13px;margin:10px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10.5px;white-space:nowrap;background:var(--bg-card2);border:1px solid var(--border);color:var(--text-muted)}
.b-gold{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-border)}
.b-good{background:rgba(29,158,117,.1);color:var(--status-good);border-color:rgba(29,158,117,.25)}
.b-bad{background:rgba(216,90,48,.1);color:var(--status-bad);border-color:rgba(216,90,48,.25)}
.b-blue{background:rgba(46,110,181,.1);color:#2E6EB5;border-color:rgba(46,110,181,.25)}
.plist{display:grid;gap:12px}
.pcard{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 18px;text-decoration:none;color:inherit}
.pcard:hover{border-color:var(--gold-border)}
.pcard .t{font-weight:500;font-size:15px}
.steps{display:flex;gap:0;margin:6px 0 20px;overflow-x:auto}
.step{flex:1;min-width:110px;text-align:center;font-size:12px;color:var(--text-dim);position:relative;padding-top:26px}
.step:before{content:'';position:absolute;top:8px;left:0;right:0;height:2px;background:var(--border)}
.step:first-child:before{left:50%}.step:last-child:before{right:50%}
.step i{position:absolute;top:2px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--border);box-sizing:border-box}
.step.done{color:var(--text-muted)}.step.done i{background:var(--status-good);border-color:var(--status-good)}
.step.cur{color:var(--text);font-weight:500}.step.cur i{background:var(--gold);border-color:var(--gold)}
.todo{list-style:none;margin:0;padding:0}
.todo li{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline}
.todo li:last-child{border-bottom:none}
.todo li:before{content:'→';color:var(--gold)}
.draft{border-bottom:1px solid var(--border);padding:12px 18px}
.draft:last-child{border-bottom:none}
.draft .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.draft .acts{margin-left:auto;display:flex;gap:6px}
.draft pre{white-space:pre-wrap;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg-card2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin:10px 0 0;max-height:320px;overflow:auto}
details summary{cursor:pointer;color:var(--text-muted);font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 14px;color:var(--text-muted);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto}
.finding{font-size:12.5px;margin:6px 0;padding-left:10px;border-left:3px solid var(--border)}
.finding.critical{border-color:var(--status-bad)}.finding.warning{border-color:var(--gold)}
.finding q{display:block;color:var(--text-muted);font-style:italic;margin-top:2px}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:10px 18px;border-bottom:1px solid var(--border);font-size:13px}
.tl li:last-child{border-bottom:none}
.tl .w{float:right;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)}
.tl .d{color:var(--text-muted);font-size:12.5px;margin-top:2px}
.sugg{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.sugg:last-child{border-bottom:none}
.empty{padding:22px 18px;color:var(--text-muted);text-align:center;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:500;max-width:90vw}
.toast.err{background:var(--status-bad)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--text-muted)}
@media(max-width:760px){main{padding:76px 16px 50px}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.draft .acts{margin-left:0}}
</style>
</head>
<body>
<header id="app-nav"></header>
<script src="/assets/app-nav.js"></script>
<main id="app"><div class="empty">Lade...</div></main>

<script>
const token = localStorage.getItem('nx_token');
const user = JSON.parse(localStorage.getItem('nx_user') || 'null');
if (!token || !user) location.href = '/login';
const API = '/api/v1';
const app = document.getElementById('app');
let current = null, refreshTimer = null, briefingDraft = null, suggestions = null;

function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function when(iso){ return iso ? new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''; }
function money(v, cur){ if (v == null || v === '') return '—'; return Number(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + (cur || 'EUR'); }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3500); }

async function api(path, opts = {}) {
  const headers = { Authorization: 'Bearer ' + token };
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path.startsWith('/api') ? path : API + path, { method: opts.method || 'GET', headers, body: opts.body });
  if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(typeof b.detail === 'string' ? b.detail : (JSON.stringify(b.detail) || 'HTTP ' + res.status)); }
  return res.json();
}
async function busy(btn, fn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Bitte warten...'; }
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}

async function ensureTenant() {
  try { await api('/tenants/me'); }
  catch (e) { try { await api('/tenants', { method: 'POST', json: { company_name: (user && (user.company_name || user.name)) || 'Mein Unternehmen' } }); } catch (e2) {} }
}

/* ---------------- Router ---------------- */
function route() {
  clearInterval(refreshTimer);
  const h = location.hash;
  if (h === '#new') return renderNew();
  if (h.startsWith('#p/')) return renderProject(h.slice(3));
  return renderList();
}
window.addEventListener('hashchange', route);

/* ---------------- Liste ---------------- */
const STATUS_BADGE = { briefing: '', sourcing: 'b-blue', collecting_offers: 'b-blue', evaluating: 'b-gold', decision: 'b-gold', awarded: 'b-good', cancelled: 'b-bad' };
async function renderList() {
  app.innerHTML = '<div class="empty">Lade Vorhaben...</div>';
  let list;
  try { list = await api('/projects'); } catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; return; }
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
      <div><h1>Meine Vorhaben</h1><div class="sub">Alles, was der Agent fuer Sie sucht, anfragt, prueft und verhandelt -- je Vorhaben an einem Ort.</div></div>
      <a class="btn pri" href="#new">Neues Vorhaben</a>
    </div>
    <div class="plist">${list.length ? list.map(p => `
      <a class="panel pcard" href="#p/${p.id}">
        <div><div class="t">${esc(p.title)}</div>
          <div class="dim">${p.entry_path === 'existing_offer' ? 'Bestehendes Angebot' : 'Neuer Bedarf'} · ${esc(p.service_type || '')}${p.last_event ? ' · zuletzt: ' + esc(p.last_event.title) + ' (' + when(p.last_event.at) + ')' : ''}</div></div>
        <div style="text-align:right;flex-shrink:0">
          <span class="badge ${STATUS_BADGE[p.status] || ''}">${esc(p.status_label)}</span>
          ${p.todo_count ? `<div class="dim" style="margin-top:6px;color:var(--gold)">${p.todo_count} Freigabe(n) offen</div>` : ''}
        </div>
      </a>`).join('') : `<div class="panel"><div class="empty">Noch keine Vorhaben. <a href="#new">Jetzt das erste anlegen</a>.</div></div>`}</div>`;
}

/* ---------------- Neues Vorhaben ---------------- */
function renderNew() {
  briefingDraft = null;
  app.innerHTML = `
    <h1>Neues Vorhaben</h1>
    <div class="sub">Wie moechten Sie starten? Der Agent arbeitet Ihnen zu -- jede E-Mail an Dienstleister legt er Ihnen vorher zur Freigabe vor, entscheiden tun immer Sie.</div>
    <div class="grid2">
      <div class="panel choice" id="c1"><h2>Etwas Neues beschaffen</h2><p>Beschreiben Sie, was Sie brauchen (Leistung, Umfang, Budget, Termin) oder laden Sie ein Briefing-Dokument hoch. Der Agent sucht passende Dienstleister, holt Angebote ein, prueft und verhandelt.</p><span class="btn pri">Bedarf beschreiben</span></div>
      <div class="panel choice" id="c2"><h2>Ich habe schon ein Angebot</h2><p>Laden Sie ein vorliegendes Angebot hoch. Der Agent prueft AGB und Konditionen, verhandelt mit dem Anbieter und holt auf Wunsch Vergleichsangebote ein.</p><span class="btn pri">Angebot hochladen</span></div>
    </div>
    <div id="flow"></div>`;
  document.getElementById('c1').onclick = () => renderBriefingInput();
  document.getElementById('c2').onclick = () => renderOfferInput();
}

function renderBriefingInput() {
  document.getElementById('flow').innerHTML = `
    <div class="panel"><div class="panel-h">1. Bedarf beschreiben</div><div class="panel-b">
      <label>Was brauchen Sie? (Dienstleistung, Umfang, Konditionen, Budget, bis wann)</label>
      <textarea id="b-text" rows="6" placeholder="z.B. Imagevideo ca. 90 Sekunden fuer unsere neue Produktlinie, ein Drehtag in Muenchen, inkl. Schnitt, Nutzungsrechte online 2 Jahre. Budget max. 12.000 EUR netto, fertig bis 15.12."></textarea>
      <label>oder/und Briefing-Dokument (PDF, Word, Excel)</label>
      <input type="file" id="b-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv">
      <div style="margin-top:14px"><button class="btn pri" id="b-go">Briefing-Entwurf erstellen</button>
      <span class="dim" style="margin-left:8px">Der Agent strukturiert nur, was Sie angeben -- Fehlendes wird als Frage markiert.</span></div>
    </div></div>`;
  document.getElementById('b-go').onclick = e => busy(e.target, async () => {
    const fd = new FormData();
    const text = document.getElementById('b-text').value.trim();
    const f = document.getElementById('b-file').files[0];
    if (text) fd.append('text', text);
    if (f) fd.append('file', f);
    if (!text && !f) throw new Error('Bitte Bedarf beschreiben oder ein Dokument waehlen.');
    briefingDraft = await api('/projects/briefing/draft', { method: 'POST', body: fd });
    briefingDraft.briefing_input = text;
    renderBriefingForm();
  });
  document.getElementById('flow').scrollIntoView({ behavior: 'smooth' });
}

function critToText(c){ return Object.entries(c || {}).map(([k, v]) => `${k}: ${v}`).join('\n'); }
function textToCrit(t){ const o = {}; (t || '').split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) o[l.slice(0, i).trim()] = l.slice(i + 1).trim(); else if (l.trim()) o[l.trim()] = 'ja'; }); return o; }

function briefingFields(d) {
  return `
    <label>Titel</label><input type="text" id="f-title" value="${esc(d.title || '')}">
    <div class="row"><div><label>Art der Leistung</label><input type="text" id="f-service" value="${esc(d.service_type || '')}"></div>
      <div><label>Region</label><input type="text" id="f-region" value="${esc(d.region || '')}"></div>
      <div><label>Leistungsort</label><input type="text" id="f-loc" value="${esc(d.delivery_location || '')}"></div></div>
    <label>Beschreibung (geht in die Anfrage an Dienstleister)</label><textarea id="f-desc" rows="5">${esc(d.description || '')}</textarea>
    <label>Muss-Kriterien (eine Zeile je Kriterium, "Kriterium: Anforderung")</label><textarea id="f-crit" rows="4">${esc(critToText(d.must_criteria))}</textarea>
    <label>Konditionen / Vorgaben (Zahlungsziel, Nutzungsrechte ...)</label><textarea id="f-cond" rows="2">${esc(d.conditions_text || '')}</textarea>
    <div class="row">
      <div><label>Budget-Obergrenze (netto) *</label><input type="number" step="0.01" id="f-ceil" value="${esc(d.budget_ceiling || '')}"></div>
      <div><label>Zielbudget (optional)</label><input type="number" step="0.01" id="f-target" value="${esc(d.budget_target || '')}"></div>
      <div><label>Benoetigt bis</label><input type="date" id="f-date" value="${esc(d.needed_by || '')}"></div>
      <div><label>Menge / Einheit</label><div style="display:flex;gap:6px"><input type="number" step="any" id="f-qty" value="${esc(d.quantity || '')}"><input type="text" id="f-unit" value="${esc(d.unit || '')}" placeholder="z.B. Video"></div></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--text)"><input type="checkbox" id="f-notify" ${d.notify_milestones === false ? '' : 'checked'}> Bei Meilensteinen per E-Mail informieren (${esc(user.email || '')})</label>`;
}
function readBriefing() {
  return {
    title: document.getElementById('f-title').value.trim(), service_type: document.getElementById('f-service').value.trim() || null,
    description: document.getElementById('f-desc').value.trim(), must_criteria: textToCrit(document.getElementById('f-crit').value),
    conditions_text: document.getElementById('f-cond').value.trim() || null, budget_ceiling: document.getElementById('f-ceil').value || null,
    budget_target: document.getElementById('f-target').value || null, needed_by: document.getElementById('f-date').value || null,
    region: document.getElementById('f-region').value.trim() || null, delivery_location: document.getElementById('f-loc').value.trim() || null,
    quantity: document.getElementById('f-qty').value || null, unit: document.getElementById('f-unit').value.trim() || null,
    notify_milestones: document.getElementById('f-notify').checked,
  };
}

function renderBriefingForm() {
  const d = briefingDraft;
  document.getElementById('flow').innerHTML = `
    <div class="panel"><div class="panel-h">2. Briefing pruefen und ergaenzen</div><div class="panel-b">
      ${d.open_questions && d.open_questions.length ? `<div class="q"><b>Offene Fragen des Agenten</b> -- bitte direkt in den Feldern ergaenzen (oder bewusst offen lassen):<ul>${d.open_questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}
      ${d.warnings && d.warnings.length ? `<div class="warn">${d.warnings.map(esc).join('<br>')}</div>` : ''}
      ${briefingFields(d)}
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn pri" id="f-start">Vorhaben anlegen und Agent starten</button>
        <button class="btn" id="f-save">Nur speichern (noch nicht starten)</button>
      </div>
    </div></div>`;
  const save = async (start) => {
    const body = { ...readBriefing(), briefing_source: d.briefing_source, briefing_input: d.briefing_input || null,
                   briefing_document_id: d.briefing_document_id, open_questions: d.open_questions || [] };
    if (start && !body.budget_ceiling) throw new Error('Bitte eine Budget-Obergrenze angeben -- sie ist der Verhandlungsrahmen des Agenten.');
    const p = await api('/projects', { method: 'POST', json: body });
    if (start) await api(`/projects/${p.id}/start`, { method: 'POST' });
    location.hash = '#p/' + p.id;
  };
  document.getElementById('f-start').onclick = e => busy(e.target, () => save(true));
  document.getElementById('f-save').onclick = e => busy(e.target, () => save(false));
  document.getElementById('flow').scrollIntoView({ behavior: 'smooth' });
}

function renderOfferInput() {
  document.getElementById('flow').innerHTML = `
    <div class="panel"><div class="panel-h">Bestehendes Angebot pruefen lassen</div><div class="panel-b">
      <label>Angebot (PDF, Word, Excel) *</label><input type="file" id="o-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv">
      <div class="row">
        <div><label>Anbieter (Firma) *</label><input type="text" id="o-company"></div>
        <div><label>E-Mail des Ansprechpartners *</label><input type="email" id="o-email"></div>
        <div><label>Name des Ansprechpartners</label><input type="text" id="o-name"></div>
        <div><label>Ihre Budget-Obergrenze (netto)</label><input type="number" step="0.01" id="o-budget"></div>
      </div>
      <label>Hinweise fuer den Agenten (optional)</label><textarea id="o-notes" rows="3" placeholder="z.B. Zahlungsziel 30 Tage ist uns wichtig, Nutzungsrechte muessen auch Social Media abdecken."></textarea>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--text)"><input type="checkbox" id="o-alt" checked> Zusaetzlich Vergleichsangebote einholen</label>
      <div style="margin-top:16px"><button class="btn pri" id="o-go">Angebot pruefen lassen</button>
      <span class="dim" style="margin-left:8px">Der Anbieter wird erst kontaktiert, wenn Sie einen Entwurf freigeben.</span></div>
    </div></div>`;
  document.getElementById('o-go').onclick = e => busy(e.target, async () => {
    const f = document.getElementById('o-file').files[0];
    const company = document.getElementById('o-company').value.trim(), email = document.getElementById('o-email').value.trim();
    if (!f || !company || !email) throw new Error('Bitte Angebot, Anbieter und E-Mail angeben.');
    const fd = new FormData();
    fd.append('file', f); fd.append('company_name', company); fd.append('contact_email', email);
    const n = document.getElementById('o-name').value.trim(); if (n) fd.append('contact_name', n);
    const b = document.getElementById('o-budget').value; if (b) fd.append('budget_ceiling', b);
    const notes = document.getElementById('o-notes').value.trim(); if (notes) fd.append('notes', notes);
    fd.append('seek_alternatives', document.getElementById('o-alt').checked ? 'true' : 'false');
    const r = await api('/projects/from-offer', { method: 'POST', body: fd });
    location.hash = '#p/' + r.project.id;
  });
  document.getElementById('flow').scrollIntoView({ behavior: 'smooth' });
}

/* ---------------- Detail ---------------- */
const STEPS = ['Briefing', 'Agent sucht', 'Anfragen laufen', 'Angebote & Verhandlung', 'Entscheidung', 'Beauftragt'];
const REVIEW_BADGE = { ok: ['b-good', 'Pruefung ok'], warning: ['b-gold', 'Hinweise'], critical: ['b-bad', 'Kritisch'], not_checked: ['', 'nicht geprueft'] };

function stepper(stage) {
  return `<div class="steps">${STEPS.map((s, i) => `<div class="step ${i < stage ? 'done' : i === stage ? 'cur' : ''}"><i></i>${s}</div>`).join('')}</div>`;
}

function draftHtml(d) {
  const nda = d.kind === 'nda';
  let acts;
  if (nda && (d.nda_status === 'returned' || d.nda_status === 'review_required')) {
    acts = `<button class="btn sm" data-ndaverify="${d.id}">Pruefen...</button><button class="btn sm bad" data-reject="${esc(d.reject)}" data-kind="nda">Ablehnen</button>`;
  } else {
    acts = `<button class="btn sm ok" data-approve="${esc(d.approve)}" data-kind="${d.kind}">${nda && d.nda_status === 'verified' ? 'Freigeben' : 'Freigeben & senden'}</button>
            <button class="btn sm bad" data-reject="${esc(d.reject)}" data-kind="${d.kind}">Verwerfen</button>`;
  }
  return `<div class="draft">
    <div class="top"><span class="badge b-gold">${esc(d.label)}</span><b>${esc(d.supplier)}</b>
      ${d.recipient ? `<span class="dim">an ${esc(d.recipient)}</span>` : ''}${d.price ? `<span class="badge b-blue">${money(d.price)}</span>` : ''}
      <span class="acts">${acts}</span></div>
    ${d.warnings && d.warnings.length ? `<div class="warn">${d.warnings.map(esc).join('<br>')}</div>` : ''}
    <details><summary>${esc(d.subject || 'Inhalt anzeigen')}</summary><pre>${esc(d.body || '')}</pre></details>
    <div id="ndav-${d.id}"></div>
  </div>`;
}

function offerHtml(o, p) {
  const rv = o.review ? REVIEW_BADGE[o.review.status] || ['', o.review.status] : ['', 'keine Pruefung'];
  const findings = (o.review && o.review.findings || []).filter(f => f.severity !== 'info' || f.source === 'ki');
  const neg = o.negotiation;
  const done = p.status === 'awarded' || p.status === 'cancelled';
  let negHtml = '';
  if (neg) {
    const NEG = { RECEIVED: 'vorbereitet', READY_TO_DRAFT: 'naechster Vorschlag moeglich', AWAITING_APPROVAL: 'Vorschlag wartet auf Freigabe',
      SEND_PENDING: 'wird gesendet', WAITING_SUPPLIER: 'wartet auf Antwort', EVALUATING_RESPONSE: 'Antwort wird ausgewertet',
      READY_FOR_DECISION: 'abgeschlossen -- Ihre Entscheidung', PAUSED: 'angehalten -- bitte pruefen' };
    negHtml = `<div class="dim" style="margin-top:6px">Verhandlung: <b>${esc(NEG[neg.status] || neg.status)}</b> · Runde 1: ${money(neg.round1, o.currency)} · Runde 2: ${money(neg.round2, o.currency)}${neg.latest_counter ? ' · Letztes Gegenangebot: <b>' + money(neg.latest_counter, o.currency) + '</b>' : ''}</div>`;
  }
  return `<tr>
    <td><b>${esc(o.supplier)}</b>${o.version > 1 ? ` <span class="badge b-good">v${o.version} nach Verhandlung</span>` : ''}${o.awarded ? ' <span class="badge b-good">beauftragt</span>' : ''}
      <div class="dim">eingegangen ${when(o.received_at)}${o.document_id ? ` · <a href="/data-center#doc/${o.document_id}">Original</a>` : ''}</div>${negHtml}</td>
    <td class="mono"><b>${money(o.total, o.currency)}</b>${o.saving ? `<div class="dim" style="color:var(--status-good)">−${money(o.saving, o.currency)}</div>` : ''}
      ${o.within_budget === false ? '<div class="dim" style="color:var(--status-bad)">ueber Budget</div>' : o.within_budget ? '<div class="dim">im Budget</div>' : ''}</td>
    <td>${esc(o.delivery_date || '—')}<div class="dim">${esc(o.payment_terms || '')}</div>${o.offer_validity_until ? `<div class="dim">gueltig bis ${new Date(o.offer_validity_until).toLocaleDateString('de-DE')}</div>` : ''}</td>
    <td><span class="badge ${rv[0]}">${rv[1]}</span>${o.comparability !== 'comparable' ? '<div class="dim">eingeschraenkt vergleichbar</div>' : ''}
      ${findings.length ? `<details><summary>${findings.length} Pruefpunkt(e)</summary>${findings.map(f => `<div class="finding ${f.severity}">${esc(f.topic ? f.topic + ': ' : '')}${esc(f.message)}${f.quote ? `<q>"${esc(f.quote)}"</q>` : ''}</div>`).join('')}</details>` : ''}</td>
    <td style="white-space:nowrap">${done ? '' : `
      ${!neg ? `<button class="btn sm" data-negotiate="${o.id}" data-total="${o.total || ''}">Verhandeln</button>` : ''}
      ${neg && neg.status === 'READY_TO_DRAFT' ? `<button class="btn sm" data-nextround="${o.id}">Naechste Runde</button>` : ''}
      ${neg ? `<button class="btn sm" data-result="${o.id}" data-counter="${neg.latest_counter || ''}">Ergebnis uebernehmen</button>` : ''}
      <button class="btn sm pri" data-award="${o.id}" data-name="${esc(o.supplier)}">Beauftragen</button>
      <div style="margin-top:6px"><button class="btn sm" data-review="${o.id}">Erneut pruefen</button></div>`}</td>
  </tr>`;
}

async function renderProject(id, keepScroll) {
  const y = window.scrollY;
  if (!keepScroll) app.innerHTML = '<div class="empty">Lade Vorhaben...</div>';
  let d;
  try { d = await api('/projects/' + id); } catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${esc(e.message)}</div></div>`; return; }
  current = d;
  const p = d.project;
  const active = !['awarded', 'cancelled'].includes(p.status);
  const contactedOrMore = d.candidates.filter(c => !['rejected'].includes(c.status));
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><div class="dim"><a href="#">Meine Vorhaben</a> / ${p.entry_path === 'existing_offer' ? 'Bestehendes Angebot' : 'Neuer Bedarf'}</div>
        <h1>${esc(p.title)}</h1>
        <div class="sub">${esc(p.service_type || '')}${p.budget_ceiling ? ' · Budget bis ' + money(p.budget_ceiling, p.currency) : ''}${p.needed_by ? ' · bis ' + new Date(p.needed_by).toLocaleDateString('de-DE') : ''}</div></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="badge ${STATUS_BADGE[p.status] || ''}">${esc(p.status_label)}</span>
        ${active ? `<button class="btn sm bad" id="p-cancel">Abbrechen</button>` : ''}</div>
    </div>
    ${stepper(d.stage)}

    ${d.todos.length ? `<div class="panel"><div class="panel-h">Jetzt zu tun</div><ul class="todo">${d.todos.map(t => `<li>${esc(t.text)}</li>`).join('')}</ul></div>` : ''}

    ${p.status === 'briefing' ? `<div class="panel"><div class="panel-h">Briefing</div><div class="panel-b">
      ${p.open_questions.length ? `<div class="q"><b>Offene Fragen</b><ul>${p.open_questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}
      ${briefingFields({ ...p, must_criteria: p.must_criteria })}
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="p-start">Speichern und Agent starten</button><button class="btn" id="p-save">Speichern</button></div>
    </div></div>` : ''}

    ${d.drafts.length ? `<div class="panel"><div class="panel-h">Wartet auf Ihre Freigabe <span class="dim">Nichts geht ohne Ihre Freigabe raus</span>
      ${d.drafts.filter(x => x.kind !== 'nda' || x.nda_status === 'draft').length > 1 ? `<button class="btn sm ok" id="approve-all">Alle Mails freigeben &amp; senden</button>` : ''}</div>
      ${d.drafts.map(draftHtml).join('')}</div>` : ''}

    ${p.status !== 'briefing' ? `<div class="panel"><div class="panel-h">Angebote <span class="dim">sortiert nach Gesamtpreis</span>
      ${active && contactedOrMore.length ? `<button class="btn sm" id="upload-offer">Angebot manuell hinzufuegen</button>` : ''}</div>
      <div id="upload-box"></div>
      ${d.offers.length ? `<div class="tscroll"><table><thead><tr><th>Anbieter</th><th>Gesamt (netto)</th><th>Termin / Zahlung</th><th>Pruefung</th><th></th></tr></thead>
        <tbody>${d.offers.map(o => offerHtml(o, p)).join('')}</tbody></table></div>`
        : `<div class="empty">Noch keine Angebote. Sobald ein Dienstleister sein Angebot per E-Mail-Anhang schickt, erfasst und prueft der Agent es automatisch.</div>`}
      ${p.decision_note ? `<div class="panel-b dim">Entscheidungsnotiz: ${esc(p.decision_note)}</div>` : ''}
    </div>` : ''}

    ${p.status !== 'briefing' ? `<div class="panel"><div class="panel-h">Dienstleister
      ${active ? `<span><button class="btn sm" id="load-sugg">Vorschlaege des Agenten</button> <button class="btn sm" id="add-manual">Manuell hinzufuegen</button></span>` : ''}</div>
      <div id="sugg-box"></div>
      ${d.candidates.length ? `<div class="tscroll"><table><thead><tr><th>Dienstleister</th><th>Status</th><th>Letzte Nachricht</th></tr></thead><tbody>
        ${d.candidates.map(c => { const m = c.messages[0]; return `<tr>
          <td><b>${esc(c.company_name)}</b>${c.is_incumbent ? ' <span class="badge">Bestandsanbieter</span>' : ''}<div class="dim">${esc(c.contact_name || '')} ${esc(c.contact_email || 'keine E-Mail')}</div></td>
          <td><span class="badge ${['declined','rejected'].includes(c.status) ? 'b-bad' : c.has_offer ? 'b-good' : 'b-blue'}">${c.has_offer ? 'Angebot liegt vor' : esc(c.status_label)}</span>
            ${c.nda_status ? `<div class="dim">NDA: ${esc(c.nda_status)}</div>` : ''}${c.rfq_invited ? '<div class="dim">Angebot angefragt</div>' : ''}</td>
          <td>${m ? `<details><summary>${m.direction === 'inbound' ? '← ' : '→ '}${esc(m.subject || '')} · ${when(m.at)}</summary><pre style="white-space:pre-wrap;font-size:12.5px">${esc(m.body)}</pre></details>` : '<span class="dim">—</span>'}</td>
        </tr>`; }).join('')}</tbody></table></div>`
        : `<div class="empty">Noch keine Dienstleister ausgewaehlt. Lassen Sie sich Vorschlaege aus Ihrem Bestand zeigen oder fuegen Sie bekannte Anbieter hinzu.</div>`}
    </div>` : ''}

    ${p.status !== 'briefing' ? `<details class="panel"><summary class="panel-h" style="margin:0">Briefing ansehen</summary><div class="panel-b"><div class="kv">
      <div>Beschreibung</div><div style="white-space:pre-wrap">${esc(p.description)}</div>
      <div>Muss-Kriterien</div><div>${Object.entries(p.must_criteria || {}).map(([k, v]) => esc(k) + ': ' + esc(v)).join('<br>') || '—'}</div>
      <div>Konditionen</div><div>${esc(p.conditions_text || '—')}</div>
      <div>Budget</div><div>${p.budget_target ? 'Ziel ' + money(p.budget_target, p.currency) + ' · ' : ''}Obergrenze ${money(p.budget_ceiling, p.currency)}</div>
      <div>Region / Ort</div><div>${esc([p.region, p.delivery_location].filter(Boolean).join(' / ') || '—')}</div>
      <div>Benachrichtigung</div><div>${p.notify_milestones ? 'Meilensteine per E-Mail an ' + esc(p.customer_email) : 'aus'}</div>
    </div></div></details>` : ''}

    <div class="panel"><div class="panel-h">Verlauf</div><ul class="tl">${d.events.map(e => `<li><span class="w">${when(e.at)}${e.emailed ? ' ✉' : ''}</span>${e.milestone ? '<b>' + esc(e.title) + '</b>' : esc(e.title)}${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}</li>`).join('') || '<li class="dim">—</li>'}</ul></div>`;

  bindProject(id);
  if (keepScroll) window.scrollTo(0, y);
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    const el = document.activeElement;
    const editing = el && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName);
    const open = document.querySelector('#sugg-box .panel-b, #upload-box .panel-b, [id^=ndav-] .panel-b, details[open]');
    if (!editing && !open && location.hash === '#p/' + id && current.project.status !== 'briefing') renderProject(id, true);
  }, 30000);
}

function bindProject(id) {
  const reload = () => renderProject(id, true);
  const $ = s => document.getElementById(s);
  if ($('p-cancel')) $('p-cancel').onclick = e => { if (confirm('Vorhaben abbrechen? Offene Entwuerfe werden verworfen.')) busy(e.target, async () => { await api(`/projects/${id}/cancel`, { method: 'POST' }); reload(); }); };
  if ($('p-save')) $('p-save').onclick = e => busy(e.target, async () => { await api('/projects/' + id, { method: 'PUT', json: { ...readBriefing(), open_questions: current.project.open_questions } }); toast('Gespeichert'); reload(); });
  if ($('p-start')) $('p-start').onclick = e => busy(e.target, async () => {
    await api('/projects/' + id, { method: 'PUT', json: { ...readBriefing(), open_questions: current.project.open_questions } });
    await api(`/projects/${id}/start`, { method: 'POST' }); toast('Agent gestartet'); await renderProject(id); showSuggestions(id);
  });
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => busy(b, async () => {
    await api(b.dataset.approve, { method: 'POST', json: b.dataset.kind === 'negotiation' ? {} : undefined }); toast('Freigegeben und versendet'); reload();
  }));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => { if (confirm('Entwurf verwerfen?')) busy(b, async () => {
    await api(b.dataset.reject, { method: 'POST', json: b.dataset.kind === 'negotiation' ? { reason: 'im Vorhaben verworfen' } : undefined }); reload(); }); });
  if ($('approve-all')) $('approve-all').onclick = e => { if (confirm('Alle angezeigten E-Mail-Entwuerfe jetzt freigeben und senden?')) busy(e.target, async () => {
    let n = 0;
    for (const d of current.drafts.filter(x => x.kind !== 'nda' || x.nda_status === 'draft')) {
      try { await api(d.approve, { method: 'POST', json: d.kind === 'negotiation' ? {} : undefined }); n++; } catch (err) { toast(`${d.supplier}: ${err.message}`, true); }
    }
    toast(n + ' versendet'); reload();
  }); };
  document.querySelectorAll('[data-ndaverify]').forEach(b => b.onclick = () => {
    const box = $('ndav-' + b.dataset.ndaverify);
    box.innerHTML = `<div class="panel-b" style="background:var(--bg-card2);border-radius:8px;margin-top:10px">
      <div class="dim">Bitte bestaetigen Sie nach Sichtung des zurueckgesendeten NDA:</div>
      ${[['version_matches','Version entspricht dem versendeten Entwurf'],['parties_match','Parteien stimmen'],['signatory_authorized','Unterzeichner ist berechtigt'],['countersignature_present','Unterschrift liegt vor']].map(([k, l]) => `<label style="display:flex;gap:8px;color:var(--text)"><input type="checkbox" data-chk="${k}"> ${l}</label>`).join('')}
      <button class="btn sm ok" style="margin-top:10px">Pruefung bestaetigen und NDA freigeben</button></div>`;
    box.querySelector('button').onclick = e => busy(e.target, async () => {
      const body = {}; box.querySelectorAll('[data-chk]').forEach(c => body[c.dataset.chk] = c.checked);
      await api(`/api/v1/sourcing/nda/${b.dataset.ndaverify}/verify`, { method: 'POST', json: body });
      await api(`/api/v1/sourcing/nda/${b.dataset.ndaverify}/approve`, { method: 'POST' });
      toast('NDA freigegeben -- Angebotsanfrage liegt zur Freigabe bereit'); reload();
    });
  });
  document.querySelectorAll('[data-negotiate]').forEach(b => b.onclick = () => {
    const total = Number(b.dataset.total || 0);
    const t = current.project.budget_target ? Number(current.project.budget_target) : null;
    const r1d = t && t < total ? Math.max(t, total * 0.85) : total * 0.9;
    const r1 = prompt(`Verhandlung starten. Angebot: ${money(total)}.\nPreisvorschlag Runde 1 (netto):`, r1d.toFixed(2));
    if (!r1) return;
    const r2 = prompt('Preisvorschlag Runde 2 (Kompromiss, netto, max. Angebotspreis):', ((Number(r1) + total) / 2).toFixed(2));
    if (!r2) return;
    busy(b, async () => { await api(`/projects/${id}/offers/${b.dataset.negotiate}/negotiate`, { method: 'POST', json: { round1_price: r1, round2_price: r2 } }); toast('Erster Preisvorschlag liegt zur Freigabe bereit'); reload(); });
  });
  document.querySelectorAll('[data-nextround]').forEach(b => b.onclick = () => busy(b, async () => { await api(`/projects/${id}/offers/${b.dataset.nextround}/next-round`, { method: 'POST' }); toast('Naechster Vorschlag liegt zur Freigabe bereit'); reload(); }));
  document.querySelectorAll('[data-result]').forEach(b => b.onclick = () => {
    const v = prompt('Verhandeltes Ergebnis (Gesamtpreis netto) uebernehmen:', b.dataset.counter || '');
    if (!v) return;
    busy(b, async () => { await api(`/projects/${id}/offers/${b.dataset.result}/record-result`, { method: 'POST', json: { total_price: v } }); toast('Ergebnis uebernommen'); reload(); });
  });
  document.querySelectorAll('[data-review]').forEach(b => b.onclick = () => busy(b, async () => { await api(`/projects/${id}/offers/${b.dataset.review}/review`, { method: 'POST' }); toast('Pruefung aktualisiert'); reload(); }));
  document.querySelectorAll('[data-award]').forEach(b => b.onclick = () => {
    const note = prompt(`${b.dataset.name} beauftragen?\nZusage und Absagen werden als Entwurf zur Freigabe vorbereitet.\nOptional: Begruendung/Notiz`, '');
    if (note === null) return;
    busy(b, async () => { await api(`/projects/${id}/award`, { method: 'POST', json: { offer_id: b.dataset.award, note: note || null } }); toast('Entscheidung gespeichert'); reload(); });
  });
  if ($('load-sugg')) $('load-sugg').onclick = () => showSuggestions(id);
  if ($('add-manual')) $('add-manual').onclick = () => showManual(id);
  if ($('upload-offer')) $('upload-offer').onclick = () => {
    $('upload-box').innerHTML = `<div class="panel-b" style="border-bottom:1px solid var(--border)"><div class="row">
      <div><label>Dienstleister</label><select id="u-cand">${current.candidates.filter(c => c.status !== 'rejected').map(c => `<option value="${c.id}">${esc(c.company_name)}</option>`).join('')}</select></div>
      <div><label>Angebotsdatei</label><input type="file" id="u-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv"></div></div>
      <div style="margin-top:10px"><button class="btn sm pri" id="u-go">Hochladen und pruefen</button> <button class="btn sm" id="u-x">Abbrechen</button></div></div>`;
    $('u-x').onclick = () => $('upload-box').innerHTML = '';
    $('u-go').onclick = e => busy(e.target, async () => {
      const f = $('u-file').files[0]; if (!f) throw new Error('Bitte Datei waehlen.');
      const fd = new FormData(); fd.append('candidate_id', $('u-cand').value); fd.append('file', f);
      await api(`/projects/${id}/offers/upload`, { method: 'POST', body: fd }); toast('Angebot erfasst und geprueft'); reload();
    });
  };
}

async function showSuggestions(id) {
  const box = document.getElementById('sugg-box');
  if (!box) return;
  box.innerHTML = '<div class="panel-b dim">Agent durchsucht Lieferantenstamm, fruehere Anfragen und Data Center...</div>';
  let s;
  try { s = await api(`/projects/${id}/suggestions`); } catch (e) { box.innerHTML = `<div class="panel-b warn">${esc(e.message)}</div>`; return; }
  suggestions = s.items;
  box.innerHTML = `<div class="panel-b" style="border-bottom:1px solid var(--border)">
    <div class="dim" style="margin-bottom:6px">${esc(s.note || '')}</div>
    ${s.items.length ? s.items.map((x, i) => `<div class="sugg">
      <input type="checkbox" data-sugg="${i}" ${x.contactable && i < 3 ? 'checked' : ''} ${x.contactable ? '' : 'disabled'}>
      <div style="flex:1"><b>${esc(x.company_name)}</b> <span class="dim">${esc(x.contact_email || 'keine E-Mail hinterlegt')}</span>
        ${x.score != null ? `<span class="badge" title="inhaltliche Naehe zum Briefing">Passung ${Math.round(x.score * 100)}%</span>` : ''}
        <div class="dim">${x.reasons.map(esc).join(' · ')}</div>
        ${x.contactable ? '' : `<input type="email" placeholder="E-Mail ergaenzen, um anzufragen" data-mail="${i}" style="margin-top:6px;max-width:320px">`}</div></div>`).join('') : ''}
    <div style="margin-top:12px"><button class="btn sm pri" id="sugg-go">Ausgewaehlte anfragen (Entwuerfe erstellen)</button> <button class="btn sm" id="sugg-x">Schliessen</button></div></div>`;
  box.querySelectorAll('[data-mail]').forEach(inp => inp.oninput = () => { const cb = box.querySelector(`[data-sugg="${inp.dataset.mail}"]`); cb.disabled = !inp.value.includes('@'); cb.checked = inp.value.includes('@'); });
  document.getElementById('sugg-x').onclick = () => box.innerHTML = '';
  document.getElementById('sugg-go').onclick = e => busy(e.target, async () => {
    const items = [];
    box.querySelectorAll('[data-sugg]:checked').forEach(cb => {
      const x = suggestions[cb.dataset.sugg]; const m = box.querySelector(`[data-mail="${cb.dataset.sugg}"]`);
      items.push({ source: x.source, ref_id: x.ref_id, company_name: x.company_name, contact_email: x.contact_email || (m && m.value.trim()), contact_name: x.contact_name });
    });
    if (!items.length) throw new Error('Bitte mindestens einen Dienstleister auswaehlen.');
    const r = await api(`/projects/${id}/candidates`, { method: 'POST', json: { items } });
    toast(`${r.created.length} Entwurf/Entwuerfe erstellt${r.skipped.length ? ', ' + r.skipped.length + ' uebersprungen' : ''}`);
    renderProject(id, true);
  });
}

function showManual(id) {
  const box = document.getElementById('sugg-box');
  box.innerHTML = `<div class="panel-b" style="border-bottom:1px solid var(--border)"><div class="row">
    <div><label>Firma *</label><input type="text" id="m-co"></div><div><label>E-Mail *</label><input type="email" id="m-mail"></div>
    <div><label>Ansprechpartner</label><input type="text" id="m-name"></div><div><label>Webseite / Quelle</label><input type="text" id="m-web"></div></div>
    <div style="margin-top:10px"><button class="btn sm pri" id="m-go">Hinzufuegen (Entwurf erstellen)</button> <button class="btn sm" id="m-x">Abbrechen</button></div></div>`;
  document.getElementById('m-x').onclick = () => box.innerHTML = '';
  document.getElementById('m-go').onclick = e => busy(e.target, async () => {
    const co = document.getElementById('m-co').value.trim(), mail = document.getElementById('m-mail').value.trim();
    if (!co || !mail) throw new Error('Firma und E-Mail sind Pflicht.');
    await api(`/projects/${id}/candidates`, { method: 'POST', json: { items: [{ source: 'manual', company_name: co, contact_email: mail,
      contact_name: document.getElementById('m-name').value.trim() || null, website: document.getElementById('m-web').value.trim() || null }] } });
    toast('Hinzugefuegt -- Erstkontakt liegt zur Freigabe bereit'); renderProject(id, true);
  });
}

ensureTenant().then(route);
</script>
