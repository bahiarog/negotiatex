<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NegotiateX.ai — Faelle (Phase 1)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
/* Page-specific rules for cases-dashboard.html (Phase 1). Shared tokens,
   reset, buttons, badges and status colors live in /assets/theme.css —
   this only adds the layout this read-only cases view needs. Class names
   (.badge, .b-<status>, .result-<result>, .kpi .v.good, etc.) are kept
   so the inline JS above continues to select elements correctly. */
:root{--hh:56px;--r:var(--radius);
  --am:var(--gold);--bl:#2E6EB5;--g:var(--status-good);--red:var(--status-bad);
  --br2:var(--border);--hov:var(--bg-card2);--tx:var(--text);--mu:var(--text-muted);--di:var(--text-dim);--C:var(--bg-card);
}
body{font-size:14px;line-height:1.5}
header{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--hh);background:rgba(247,246,241,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);text-decoration:none;flex-shrink:0}
.logo em{color:var(--gold);font-style:normal}
.hdr-sep{width:1px;height:20px;background:var(--border)}
.hdr-pg{font-size:12px;color:var(--text-muted)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.phase-note{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text-muted);background:var(--bg-card2);border:1px solid var(--border);padding:5px 10px;border-radius:7px;letter-spacing:.3px}
.h-btn{font-size:12px;color:var(--text-muted);background:transparent;border:1px solid var(--border);padding:5px 11px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none}
.h-btn:hover{border-color:var(--gold-border);color:var(--text)}
main{padding:calc(var(--hh) + 28px) 28px 60px;max-width:1200px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:4px}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 20px 48px rgba(22,32,28,0.04)}
.kpi .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi .v{font-family:'DM Mono',monospace;font-size:22px;font-weight:500}
.kpi .v.good{color:var(--status-good)}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;box-shadow:0 20px 48px rgba(22,32,28,0.04)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 18px;color:var(--text-muted);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 18px;border-bottom:1px solid var(--border)}
tr.case-row{cursor:pointer}
tr.case-row:hover{background:var(--bg-card2)}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.3px}
.b-received,.b-extracting{background:rgba(46,110,181,.1);color:var(--bl)}
.b-needs_data,.b-review_required,.b-paused{background:var(--gold-dim);color:var(--gold)}
.b-ready_to_draft,.b-ready_for_decision{background:rgba(29,158,117,.1);color:var(--status-good)}
.b-awaiting_approval,.b-send_pending,.b-waiting_supplier,.b-evaluating_response{background:var(--gold-dim);color:var(--gold)}
.b-closed{background:var(--bg-card2);color:var(--text-muted)}
.b-cancelled,.b-error{background:rgba(216,90,48,.1);color:var(--status-bad)}
.result-ok{color:var(--status-good)}
.result-warning{color:var(--gold)}
.result-violation{color:var(--status-bad)}
.result-na{color:var(--text-dim)}
.empty{padding:28px 18px;color:var(--text-muted);font-size:13px;text-align:center}
.back{display:inline-block;margin-bottom:14px;color:var(--text-muted);font-size:12px;text-decoration:none;cursor:pointer}
.back:hover{color:var(--text)}
.mono{font-family:'DM Mono',monospace}
.events{list-style:none;padding:18px;font-size:12.5px}
.events li{padding:7px 0;border-bottom:1px solid var(--border);color:var(--text-muted)}
.events li b{color:var(--text)}
.loading{padding:40px;text-align:center;color:var(--text-muted)}
</style>
</head>
<body>
<header>
  <a class="logo" href="/dashboard"><em>Negotiate</em>X.ai</a>
  <div class="hdr-sep"></div>
  <span class="hdr-pg">Faelle &amp; Vergleiche</span>
  <div class="hdr-r">
    <span class="phase-note">Phase 1 — Lesebetrieb, keine Freigaben/Versand</span>
    <a class="h-btn" href="/dashboard">Zurueck zum Dashboard</a>
  </div>
</header>
<main id="app">
  <div class="loading">Lade...</div>
</main>

<script>
const token = localStorage.getItem('nx_token');
const user  = JSON.parse(localStorage.getItem('nx_user') || 'null');
if (!token || !user) location.href = '/login';

const API = '/api/v1';
const app = document.getElementById('app');

async function api(path, opts) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, ...(opts && opts.headers || {}) }
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || ('HTTP ' + res.status));
  }
  return res.json();
}

function badgeClass(status) { return 'badge b-' + status.toLowerCase(); }
function fmtMoney(v, cur) { return (v === null || v === undefined) ? '—' : (Number(v).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + (cur || 'EUR')); }
function escapeHtml(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function renderList() {
  app.innerHTML = '<div class="loading">Lade Faelle...</div>';
  let cases = [];
  let tenantError = null;
  try {
    cases = await api('/cases');
  } catch (e) {
    tenantError = e.message;
  }

  if (tenantError) {
    app.innerHTML = `
      <h1>Faelle</h1>
      <p class="sub">Phase 1 — Datenmodell, Upload, Extraktion, Policy Engine, Vergleiche (reiner Lesebetrieb)</p>
      <div class="panel"><div class="empty">Zugriff nicht moeglich: ${escapeHtml(tenantError)}<br>
      (Ihr Benutzer ist evtl. noch keinem Mandanten zugeordnet — ueber <span class="mono">POST /api/v1/tenants</span> anlegen.)</div></div>`;
    return;
  }

  const rows = cases.map(c => `
    <tr class="case-row" onclick="location.hash='#case/${c.id}'">
      <td class="mono">${escapeHtml(c.title)}</td>
      <td>${escapeHtml(c.category || '—')}</td>
      <td><span class="${badgeClass(c.status)}">${escapeHtml(c.status)}</span></td>
      <td class="mono">v${c.case_version}</td>
      <td class="mono">${new Date(c.created_at).toLocaleString('de-DE')}</td>
    </tr>`).join('');

  app.innerHTML = `
    <h1>Faelle</h1>
    <p class="sub">Phase 1 — Datenmodell, Upload, Extraktion, Policy Engine, Vergleiche (reiner Lesebetrieb). Keine Freigaben, kein Versand.</p>
    <div class="panel">
      <div class="panel-h">Alle Faelle (${cases.length})</div>
      ${cases.length ? `<table><thead><tr><th>Titel</th><th>Kategorie</th><th>Status</th><th>Version</th><th>Erstellt</th></tr></thead><tbody>${rows}</tbody></table>`
                     : '<div class="empty">Noch keine Faelle vorhanden.</div>'}
    </div>`;
}

async function renderCase(caseId) {
  app.innerHTML = '<div class="loading">Lade Fall...</div>';
  const [caseData, events, comparison] = await Promise.all([
    api(`/cases/${caseId}`),
    api(`/cases/${caseId}/events`),
    api(`/cases/${caseId}/comparison`).catch(() => ({ items: [], total_potential_savings: '0', policy_name: null, policy_version: null })),
  ]);

  const eventRows = events.map(e => `
    <li><b>${escapeHtml(e.to_status)}</b> ${e.from_status ? '(von ' + escapeHtml(e.from_status) + ')' : ''}
      — ${escapeHtml(e.reason || '')} <span class="mono">[${escapeHtml(e.actor)}, ${new Date(e.created_at).toLocaleString('de-DE')}]</span></li>`).join('');

  const itemRows = comparison.items.map(it => `
    <tr>
      <td>${escapeHtml(it.description || '—')}</td>
      <td class="mono">${it.quantity ?? '—'} ${escapeHtml(it.unit || '')}</td>
      <td class="mono">${fmtMoney(it.unit_price, it.currency)}</td>
      <td class="mono">${fmtMoney(it.net_total, it.currency)}</td>
      <td class="result-${it.result}">${escapeHtml(it.result)}</td>
      <td style="max-width:260px">${escapeHtml(it.message)}</td>
      <td class="mono">${fmtMoney(it.potential_savings, it.currency)}</td>
    </tr>`).join('');

  app.innerHTML = `
    <a class="back" onclick="location.hash=''">&larr; Zurueck zur Fallliste</a>
    <h1>${escapeHtml(caseData.title)}</h1>
    <p class="sub">${escapeHtml(caseData.category || '')} &middot; <span class="${badgeClass(caseData.status)}">${escapeHtml(caseData.status)}</span> &middot; Version ${caseData.case_version}</p>

    <div class="kpis">
      <div class="kpi"><div class="l">Status</div><div class="v">${escapeHtml(caseData.status)}</div></div>
      <div class="kpi"><div class="l">Aktive Policy</div><div class="v">${comparison.policy_name ? escapeHtml(comparison.policy_name) + ' (v' + comparison.policy_version + ')' : '— keine —'}</div></div>
      <div class="kpi"><div class="l">Potenzielle Einsparung</div><div class="v good">${fmtMoney(comparison.total_potential_savings, 'EUR')}</div></div>
    </div>

    <div class="panel">
      <div class="panel-h">Positionen &amp; Policy-Pruefung (Vergleich)</div>
      ${comparison.items.length ? `<table><thead><tr><th>Beschreibung</th><th>Menge</th><th>Einzelpreis</th><th>Nettosumme</th><th>Ergebnis</th><th>Hinweis</th><th>Potenzial</th></tr></thead><tbody>${itemRows}</tbody></table>`
                                  : '<div class="empty">Keine extrahierten Positionen (oder Extraktion noch ausstehend).</div>'}
    </div>

    <div class="panel">
      <div class="panel-h">Verlauf (Case Events)</div>
      ${events.length ? `<ul class="events">${eventRows}</ul>` : '<div class="empty">Keine Ereignisse.</div>'}
    </div>`;
}

async function route() {
  const hash = location.hash;
  if (hash.startsWith('#case/')) {
    const id = hash.slice('#case/'.length);
    try { await renderCase(id); } catch (e) { app.innerHTML = `<div class="panel"><div class="empty">Fehler: ${escapeHtml(e.message)}</div></div>`; }
  } else {
    await renderList();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
