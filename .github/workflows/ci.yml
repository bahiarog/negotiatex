name: NegotiateX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check app/ --ignore E501,E402

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt pytest pytest-asyncio httpx
      - run: pytest app/tests/ -v --tb=short 2>/dev/null || echo "No tests yet"

# Kein automatisches Deployment aus GitHub: deployt wird nur mit ops/deploy.py nach Freigabe
# durch Rafael (Sicherung, Health-Checks, automatischer Ruecksprung). Das fruehere Deploy per
# Root-Passwort (secrets.VPS_PASSWORD) ist entfernt (23.11.2026).
