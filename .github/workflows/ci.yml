name: NegotiateX CI

# Laeuft bei jedem Push und Pull Request. Prueft, was den Betrieb wirklich bricht:
# Python-Syntax, undefinierte Namen, kaputtes JavaScript in den Seiten, Shell-Skripte.
# Kein automatisches Deployment: deployt wird nur mit ops/deploy.py nach Freigabe durch Rafael.
# (Das fruehere Deploy per Root-Passwort wurde am 23.11.2026 entfernt.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python kompiliert
        run: python -m compileall -q app

      - name: Kritische Python-Fehler (Syntax, undefinierte Namen)
        run: |
          pip install --quiet ruff
          ruff check app/ --target-version py312 --select E9,F63,F7,F82 --output-format github

      - name: JavaScript der Seiten
        run: |
          fail=0
          for f in landing/*.html; do
            awk '/^<script>$/{f=1;next} /^<\/script>$/{f=0} f' "$f" > /tmp/inline.js
            [ -s /tmp/inline.js ] || continue
            node --check /tmp/inline.js || { echo "::error file=$f::JavaScript-Syntaxfehler"; fail=1; }
          done
          for f in landing/assets/*.js; do node --check "$f" || fail=1; done
          exit $fail

      - name: Shell-Skripte
        run: for f in ops/*.sh; do bash -n "$f"; done
